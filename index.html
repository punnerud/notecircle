os","g4":"Nivel 3–4 · Arpegios","g5":"Nivel 4 · Jazz y escalas simétricas"},"instrumentGroups":{"strings":"Cuerdas","woodwind":"Viento madera","brass":"Viento metal","other":"Teclado y percusión"},"instruments":{"violin":"Violín","viola":"Viola","cello":"Violonchelo","dbass":"Contrabajo","piccolo":"Flautín","flute":"Flauta","altflute":"Flauta alto en Sol","oboe":"Oboe","englhorn":"Corno inglés en Fa","klar_bb":"Clarinete en Si♭","klar_a":"Clarinete en La","klar_eb":"Clarinete en Mi♭","bassklar":"Clarinete bajo en Si♭","fagott":"Fagot","kontrafag":"Contrafagot","sopransax":"Saxofón soprano en Si♭","altsax":"Saxofón alto en Mi♭","tenorsax":"Saxofón tenor en Si♭","barisax":"Saxofón barítono en Mi♭","tromp_bb":"Trompeta en Si♭","tromp_c":"Trompeta en Do","tromp_d":"Trompeta en Re","tromp_eb":"Trompeta en Mi♭","picctromp":"Trompeta piccolo en Si♭","kornett_bb":"Cornetín en Si♭","kornett_eb":"Cornetín soprano en Mi♭","flygelhorn":"Fliscorno en Si♭","basstromp":"Trompeta baja en Si♭","horn_f":"Trompa en Fa","althorn":"Trompa alto en Mi♭","trombone":"Trombón","basstrombone":"Trombón bajo","eufonium_c":"Bombardino (clave de Fa)","eufonium_bb":"Bombardino/barítono en Si♭ (clave de Sol)","tuba":"Tuba (clave de Fa)","tuba_eb":"Tuba en Mi♭ (clave de Sol, brass band)","tuba_bb":"Tuba en Si♭ (clave de Sol, brass band)","piano":"Piano","klokkespill":"Glockenspiel","xylofon":"Xilófono","pauker":"Timbales"},"levels":[{"name":"Principiante","sub":"escuela de música, 1.º–2.º año","body":"Do, Fa y Sol mayor (tonalidades escritas); La menor hacia el final. Una octava, tranquilo y regular (♩ ≈ 60–72). El sonido antes que la técnica.","tips":["Primero notas largas: 8 o más pulsos por nota con una columna de aire o un arco tranquilo y uniforme.","Canta la escala antes de tocarla — escucha la nota antes de producirla.","Usa un espejo y escucha: un sonido uniforme en cada nota importa más que el tempo."],"brassTips":["Primero notas largas: 8 o más pulsos en sol¹ y do¹ (do grave) con una columna de aire tranquila y abierta.","Flexibilidades sobre los armónicos al aire (do¹–sol¹–do²), sin pistones, antes de la escala.","Canta o haz «buzzing» de la escala en la boquilla antes de tocarla."]},{"name":"Intermedio","sub":"grados 3–5 / nivel medio","body":"Mayores hasta 3–4 alteraciones (las tonalidades de banda), menor en sus formas armónica y melódica, escala cromática, séptima de dominante. Corcheas a ♩ ≈ 80–100, tanto ligado como picado.","tips":["Practica la escala primero ligada y luego articulada al mismo tempo — siempre con metrónomo.","Practica también desde la nota más aguda hacia abajo — el descenso revela las irregularidades.","Planifica la respiración o el arco: la última nota tan plena como la primera."],"brassTips":["Flexibilidades diarias (Arban/Schlossberg) en todas las combinaciones de pistones.","Practica la escala primero ligada y luego picada al mismo tempo — siempre con metrónomo.","Planifica la respiración: como máximo una respiración por cada octava, y la última nota tan plena como la primera."]},{"name":"Avanzado","sub":"grado profesional / grados 6–8","body":"Las 12 tonalidades mayores y menores de memoria, arpegios (mayor, menor, dom7, dim7). Dos octavas donde el registro lo permita. Semicorcheas a ♩ ≈ 80–112, articulaciones mixtas.","tips":["Practica las escalas también en patrones de terceras y con variaciones rítmicas.","Las dos octavas nacen del control y la relajación — no de la fuerza.","Los modos: misma armadura, nuevo punto de partida — escucha la diferencia."],"brassTips":["Practica las escalas también desde la nota más aguda hacia abajo, y en patrones de terceras.","Las dos octavas nacen del apoyo del aire y la flexibilidad — no de la presión de la boquilla.","Los modos: misma armadura, nuevo punto de partida — escucha la diferencia."]},{"name":"Profesional","sub":"conservatorio superior / rutina diaria","body":"Todas las tonalidades en todos los modos, escalas de jazz y simétricas, estudios de patrones por todo el registro — en todas las articulaciones y dinámicas.","tips":["Rota: una tonalidad al día, pasando por todos los modos y arpegios.","Practica en todas las dinámicas — el pianissimo es el que más revela.","Transporta estudios: piensa en sonido real y escrito a la vez."],"brassTips":["El estudio n.º 2 de Clarke por todas las tonalidades — pianissimo y sin esfuerzo.","Rota: una tonalidad al día, pasando por todos los modos y arpegios.","Transporta estudios: piensa en sonido real y escrito a la vez."]}],"theory":{"tKvintTitle":"Cómo leer el círculo de quintas","tKvint":"<p>El círculo de quintas ordena todas las tonalidades según cuántas alteraciones tiene su armadura. Un paso <b>en sentido horario</b> es una quinta justa ascendente — y un sostenido más (o un bemol menos). Un paso <b>en sentido antihorario</b> es una quinta descendente — un bemol más.</p><p>Las tonalidades vecinas comparten seis de sus siete notas y por eso suenan estrechamente emparentadas. Esa es la razón de que la <b>dominante (D)</b> — la quinta superior — y la <b>subdominante (S)</b> — la quinta inferior — sean las funciones armónicas más importantes junto a la tónica.</p><p>El anillo exterior y el interior en la misma posición comparten armadura: son <b>tonalidades relativas</b> (p. ej. {exMajor} y {exMinor}). En la parte inferior del círculo, el lado de los sostenidos y el de los bemoles se encuentran en las tonalidades <b>enarmónicas</b>: las mismas notas reales, dos escrituras distintas.</p>","tFortegnTitle":"La armadura: orden de las alteraciones y todas las tonalidades","tFortegn":"<p>Los sostenidos aparecen siempre en el orden <b>{sharpOrder}</b> (por quintas ascendentes). Los bemoles aparecen en el orden inverso: <b>{flatOrder}</b> (por quintas descendentes).</p><p>Dos reglas útiles: el <b>último sostenido</b> está un semitono por debajo de la tónica de la tonalidad mayor (es la sensible). El <b>penúltimo bemol</b> <i>es</i> la tonalidad mayor.</p>","thSig":"Armadura","thDur":"Mayor","thMoll":"Menor","thAccs":"Alteraciones","tParallellTitle":"Tonalidad relativa y tonalidad homónima","tParallell":"<p>En la teoría española, la <b>tonalidad relativa</b> es la pareja de mayor y menor que comparte armadura, con las tónicas a distancia de tercera menor: {exKey} ↔ {exRel}. (En la teoría alemana y nórdica se la llama «tonalidad paralela» — ¡cuidado con las traducciones!)</p><p>La <b>tonalidad homónima</b> es la pareja de mayor y menor sobre <i>la misma tónica</i>, p. ej. {exVar1} y {exVar2} — misma tónica, pero tres alteraciones de diferencia.</p><p>El modo menor existe en tres formas: <b>natural</b> (como su relativo mayor), <b>armónica</b> (7.º grado elevado — aporta la sensible y una característica segunda aumentada) y <b>melódica</b> (6.º y 7.º grados elevados al ascender; forma natural al descender en la tradición clásica).</p>","tTranspTitle":"Transporte: {instr} y otros instrumentos","tTranspTransposing":"<p>{instr} es un <b>instrumento transpositor</b>: un Do escrito suena como {soundsNote} — {interval} {direction}. Para obtener el sonido real deseado se escribe, por tanto, {interval} {oppositeDirection}.</p>","tTranspNon":"<p>{instr} es un <b>instrumento no transpositor</b>: la nota escrita y el sonido real coinciden. Aun así, la tabla siguiente muestra cómo se relacionan los instrumentos transpositores con la altura real.</p>","tTranspTable":"<p>El mismo principio vale para el resto de la orquesta: el <b>clarinete en Si♭</b> (una segunda mayor ascendente), la <b>trompa en Fa</b> (una quinta justa ascendente), el <b>saxofón alto en Mi♭</b> (una sexta mayor ascendente), el <b>contrabajo</b> (una octava ascendente). Regla práctica: el nombre del instrumento es el sonido real que produce cuando toca un Do escrito.</p>","thConcert":"Sonido real (concierto)","thWritten":"Escrito para {instr}","thWrittenSig":"Armadura escrita","lower":"por debajo","higher":"por encima","up":"ascendente","down":"descendente","tIntonasjonTitle":"La afinación en los metales con pistones","tIntonasjon":"<p>Los pistones bajan la nota añadiendo tubos de longitud fija, pero las combinaciones quedan demasiado cortas — por eso algunas digitaciones desafinan de forma sistemática:</p><p><b>1·3 y 1·2·3 quedan altas.</b> El {noteD4} escrito (1·3) y el {noteCiss4} (1·2·3) son los casos célebres: saca la bomba del tercer pistón (aprox. 1–1,5 cm para 1·3, 2–2,5 cm para 1·2·3).</p><p><b>El 5.º armónico queda bajo.</b> El {noteE5} escrito con la digitación al aire está ~14 cents bajo — corrige con los labios, o usa 1·2 (6.º armónico) como digitación alternativa.</p><p><b>El 7.º armónico se evita.</b> El {noteB5} al aire está ~31 cents bajo y solo se usa para efectos de jazz («shake») — tócalo con el primer pistón.</p><p>El tercer pistón solo ≈ 1·2 y se usa como digitación alternativa para trinos y afinación ({alt3list}).</p>","tGrepTitle":"Tabla de digitaciones completa (cromática, escrito {low}–{high})","tGrep":"<p>Todas las digitaciones de {instr}, desde la nota más grave ({low}) hasta el registro agudo. Las notas que pertenecen a la escala elegida aparecen resaltadas. Pasa el puntero sobre una celda para ver digitaciones alternativas y consejos de afinación. Numeración de octavas según el estándar internacional: Do4 = do central.</p>","tGrepPiccoloNote":"<p>Nota: la trompeta piccolo suele tener un cuarto pistón (baja una cuarta justa) que amplía el registro hacia el grave.</p>"},"footer":{"ruleTransposing":"{instr}: la nota escrita suena {interval} {direction}.","ruleNon":"{instr}: la altura escrita y el sonido real coinciden."},"families":{"trumpet":"Trompeta","horn":"Trompa","trombone":"Trombón","euphonium":"Bombardino","tuba":"Tuba","flute":"Flauta","oboe":"Oboe","clarinet":"Clarinete","bassoon":"Fagot","sax":"Saxofón","violinF":"Violín","violaF":"Viola","celloF":"Violonchelo","dbassF":"Contrabajo","pianoF":"Piano","percussion":"Percusión"}},"en":{"meta":{"lang":"en","name":"English"},"ui":{"title":"The Note Circle","subtitle":"Keys, scales, transposition nd dynamics.","tips":["Rotate: one key per day, through all modes and arpeggios.","Practice in all dynamics — pianissimo reveals the most.","Transpose etudes: think concert and written pitch at the same time."],"brassTips":["Clarke study no. 2 through all keys — pianissimo and effortless.","Rotate: one key per day, through all modes and arpeggios.","Transpose etudes: think concert and written pitch at the same time."]}],"theory":{"tKvintTitle":"How to read the circle of fifths","tKvint":"<p>The circle of fifths arranges all keys by how many sharps or flats are in their key signature. One step <b>clockwise</b> is a perfect fifth up — and one more sharp (or one flat fewer). One step <b>counterclockwise</b> is a fifth down — one more flat.</p><p>Neighboring keys share six of their seven notes and therefore sound closely related. That is why the <b>dominant (D)</b> — the fifth above — and the <b>subdominant (S)</b> — the fifth below — are the most important chord functions next to the tonic.</p><p>The outer and inner ring at the same position share a key signature: these are <b>relative keys</b> (e.g. {exMajor} and {exMinor}). At the bottom of the circle the sharp and flat sides meet in the <b>enharmonic</b> keys: the same sounding pitches, two ways of writing them.</p>","tFortegnTitle":"Key signatures: order and all keys","tFortegn":"<p>The sharps always appear in the order <b>{sharpOrder}</b> (rising in fifths). The flats appear in the opposite order: <b>{flatOrder}</b> (falling in fifths).</p><p>Two useful rules of thumb: the <b>last sharp</b> is a half step below the tonic of the major key (the leading tone). The <b>second-to-last flat</b> <i>is</i> the major key.</p>","thSig":"Key signature","thDur":"Major","thMoll":"Minor","thAccs":"Sharps/flats","tParallellTitle":"Relative key and parallel key","tParallell":"<p>In English theory, the <b>relative key</b> is the major or minor key that shares the same key signature, with tonics a minor third apart: {exKey} ↔ {exRel}. (Beware in translation: German and Scandinavian theory calls this the “parallel key” — a false friend!)</p><p>The <b>parallel key</b> is major and minor on the <i>same tonic</i>, e.g. {exVar1} and {exVar2} — same tonic, but three accidentals apart. (In Germanic terminology this is the “variant key.”)</p><p>Minor comes in three forms: <b>natural</b> (as its relative major), <b>harmonic</b> (raised 7th degree — providing a leading tone and a characteristic augmented second) and <b>melodic</b> (raised 6th and 7th degrees ascending; the natural form descending in the classical tradition).</p>","tTranspTitle":"Transposition: {instr} and other instruments","tTranspTransposing":"<p>{instr} is a <b>transposing instrument</b>: a written C sounds as {soundsNote} — {interval} {direction}. To obtain a desired sounding pitch, you therefore write {interval} {oppositeDirection}.</p>","tTranspNon":"<p>{instr} is <b>non-transposing</b>: the written note and the sounding pitch are the same. The table below still shows how transposing instruments relate to concert pitch.</p>","tTranspTable":"<p>The same principle applies to the rest of the orchestra: <b>clarinet in B♭</b> (a major second up), <b>French horn in F</b> (a perfect fifth up), <b>alto saxophone in E♭</b> (a major sixth up), <b>double bass</b> (an octave up). Rule of thumb: the instrument's name is the pitch that sounds when it plays a written C.</p>","thConcert":"Concert pitch (sounding)","thWritten":"Written for {instr}","thWrittenSig":"Written key signature","lower":"lower","higher":"higher","up":"up","down":"down","tIntonasjonTitle":"Intonation on valved brass","tIntonasjon":"<p>The valves lower the pitch by fixed lengths of tubing, but combinations come out too short — so some fingerings are systematically out of tune:</p><p><b>1·3 and 1·2·3 are sharp.</b> Written {noteD4} (1·3) and {noteCiss4} (1·2·3) are the notorious ones: extend the 3rd-valve slide (about 1–1.5 cm for 1·3, 2–2.5 cm for 1·2·3).</p><p><b>The 5th partial is flat.</b> Written {noteE5} with the open fingering sits ~14 cents flat — adjust with the lips, or use 1·2 (6th partial) as an alternate fingering.</p><p><b>The 7th partial is avoided.</b> Open {noteB5} sits ~31 cents flat and is used only for jazz effects (the “shake”) — play it with the 1st valve.</p><p>The 3rd valve alone ≈ 1·2 and serves as an alternate fingering for trills and intonation ({alt3list}).</p>","tGrepTitle":"Full fingering chart (chromatic, written {low}–{high})","tGrep":"<p>All fingerings for {instr}, from the lowest note ({low}) up into the high register. Notes belonging to the selected scale are highlighted. Hover over a cell for alternate fingerings and intonation tips. Octave numbers follow the international standard: C4 = middle C.</p>","tGrepPiccoloNote":"<p>Note: the piccolo trumpet usually has a 4th valve (lowering the pitch a perfect fourth) that extends the range downward.</p>"},"footer":{"ruleTransposing":"{instr}: a written note sounds {interval} {direction}.","ruleNon":"{instr}: written and sounding pitch are the same."},"families":{"trumpet":"Trumpet","horn":"French horn","trombone":"Trombone","euphonium":"Euphonium","tuba":"Tuba","flute":"Flute","oboe":"Oboe","clarinet":"Clarinet","bassoon":"Bassoon","sax":"Saxophone","violinF":"Violin","violaF":"Viola","celloF":"Cello","dbassF":"Double bass","pianoF":"Piano","percussion":"Percussion"}}};
const LANG_ORDER = ['no', 'sv', 'da', 'de', 'fr', 'es', 'en'];
const NOTE_SYSTEMS = { no: 'gss', sv: 'gss', da: 'gs', de: 'gs', fr: 'sf_fr', es: 'sf_es', en: 'letters' };
const SCALE_NAME_LOWER = { no: 1, sv: 1, da: 1, fr: 1, es: 1 };

function T(path, tokens) {
  const dig = (lang) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), I18N[lang]);
  let v = dig(state.lang);
  if (v == null) v = dig('no');
  if (typeof v === 'string' && tokens) v = fmt(v, tokens);
  return v;
}
function fmt(s, tokens) {
  return s.replace(/\{(\w+)\}/g, (m, k) => (tokens && k in tokens) ? tokens[k] : m);
}

// Notenavn i språkets egen tradisjon
function nativeName(letter, alt, sys) {
  if (sys === 'letters') return intlName(letter, alt);
  if (sys === 'gss') return norName(letter, alt);
  if (sys === 'gs') { // tysk/dansk enkeltkonsonant
    if (letter === 'B') {
      if (alt === 0) return 'H';
      if (alt === 1) return 'His';
      if (alt === 2) return 'Hisis';
      if (alt === -1) return 'B';
      return 'Heses';
    }
    if (alt > 0) return letter + 'is'.repeat(alt);
    if (alt === 0) return letter;
    const single = { C: 'Ces', D: 'Des', E: 'Es', F: 'Fes', G: 'Ges', A: 'As' }[letter];
    if (alt === -1) return single;
    return { E: 'Eses', A: 'Asas' }[letter] || (single + 'es');
  }
  const base = sys === 'sf_fr' ? ['Do', 'Ré', 'Mi', 'Fa', 'Sol', 'La', 'Si']
                               : ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Si'];
  return base[LETTERS.indexOf(letter)] + accSymbol(alt);
}
function dispNote(t, namingOverride) {
  const naming = namingOverride || state.naming;
  if (naming === 'intl') return intlName(t.letter, t.alt);
  return nativeName(t.letter, t.alt, NOTE_SYSTEMS[state.lang] || 'letters');
}
function lcFirst(s) { return s.charAt(0).toLowerCase() + s.slice(1); }

  const n = dispNote(t);
  if (quality === 'dur') return fmt(T('keys.majorPattern'), { note: n });
  const note = T('keys.minorLowercase') ? lcFirst(n) : n;
  return fmt(T('keys.minorPattern'), { note });
}
function scaleName(id) {
  const base = T('scales.' + id);
  return SCALES[id].arp ? base + ' ' + T('scales.arpSuffix') : base;
}
function scaleTonicName(t, scaleId) {
  const n = dispNote(t);
  return (T('keys.minorLowercase') && SCALES[scaleId].ring === 'min') ? lcFirst(n) : n;
}
function scaleHeading(t, scaleId, quality) {
  if (scaleId === 'dur' || scaleId === 'nmoll') return keyLabel(t, quality);
  let nm = scaleName(scaleId);
  if (SCALE_NAME_LOWER[state.lang]) nm = nm.toLowerCase();
  return scaleTonicName(t, scaleId) + ' ' + nm;
}
function fortegnText(f) {
  if (f === 0) return T('ui.noSig');
  const n = Math.abs(f);
  if (f > 0) return n + ' ' + T(n === 1 ? 'ui.sharpOne' : 'ui.sharpMany');
  return n + ' ' + T(n === 1 ? 'ui.flatOne' : 'ui.flatMany');
}
// «en stor sekund», «en oktav og en ren kvint», «to oktaver» ...
function intervalName(letters, semis) {
  const p = intervalParts(letters, semis);
  const iv = T('intervals');
  if (p.num === 0 && p.octs > 0) return p.octs === 1 ? iv.octaveOne : iv.octaveTwo;
  if (p.num === 0 && p.octs === 0 && iv.unison) return iv.unison;
  const core = fmt(iv.pattern, { qual: iv.qualities[p.qual], num: iv.numbers[p.num] });
  if (p.octs === 0) return core;
  const oct = p.octs === 1 ? iv.octaveOne : iv.octaveTwo;
  return fmt(iv.octavePlus, { oct, qual: iv.qualities[p.qual], num: iv.numbers[p.num] });
}
function instrName(id) { return T('instruments.' + id) || id; }

/* ---------------- Flagg (inline SVG, 24x16) ---------------- */
function flagSvg(code) {
  const r = (x, y, w, h, f) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`;
  let inner = '';
  if (code === 'no') inner = r(0,0,24,16,'#BA0C2F') + r(6,0,4,16,'#fff') + r(0,6,24,4,'#fff') + r(7,0,2,16,'#00205B') + r(0,7,24,2,'#00205B');
  if (code === 'sv') inner = r(0,0,24,16,'#006AA7') + r(7,0,3,16,'#FECC02') + r(0,6.5,24,3,'#FECC02');
  if (code === 'da') inner = r(0,0,24,16,'#C8102E') + r(7,0,3,16,'#fff') + r(0,6.5,24,3,'#fff');
  if (code === 'de') inner = r(0,0,24,5.33,'#000') + r(0,5.33,24,5.34,'#DD0000') + r(0,10.67,24,5.33,'#FFCE00');
  if (code === 'fr') inner = r(0,0,8,16,'#002395') + r(8,0,8,16,'#fff') + r(16,0,8,16,'#ED2939');
  if (code === 'es') inner = r(0,0,24,16,'#AA151B') + r(0,4,24,8,'#F1BF00');
  if (code === 'en') inner = r(0,0,24,16,'#012169')
    + `<path d="M0 0 L24 16 M24 0 L0 16" stroke="#fff" stroke-width="3.2"/>`
    + `<path d="M0 0 L24 16 M24 0 L0 16" stroke="#C8102E" stroke-width="1.4"/>`
    + r(10,0,4,16,'#fff') + r(0,6,24,4,'#fff') + r(11,0,2,16,'#C8102E') + r(0,7,24,2,'#C8102E');
  return `<svg width="24" height="16" viewBox="0 0 24 16" aria-hidden="true">${inner}</svg>`;
}

const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);

  return e;
}
function txt(parent, x, y, str, attrs) {

}
function cubicPts(p0, p1, p2, p3, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, m = 1 - t;
    pts.push([
      m*m*m*p0[0] + 3*m*m*t*p1[0] + 3*m*t*t*p2[0] + t*t*t*p3[0],
      m*m*m*p0[1] + 3*m*m*t*p1[1] + 3*m*t*t*p2[1] + t*t*t*p3[1],

  return pts;
}
function polyPath(pts) {

function strokeGroup(parent) {
  return el('g', { fill: 'none', stroke: 'var(--staff-ink)', 'stroke-linecap': 'round' }, parent);

// G-nøkkel. Origo = G4-linja.
function drawTrebleClef(parent, x, yAnchor, sp) {
  const S = p => p.map(q => [x + q[0]*sp, yAnchor + q[1]*sp]);
  const apex = [-0.05, -4.85];
  const spine = S([].concat(
    cubicPts(apex, [0.10,-3.2], [0.16,-1.0], [0.14,0.6], 22),
    cubicPts([0.14,0.6], [0.13,1.4], [0.14,1.9], [0.10,2.2], 8),
    cubicPts([0.10,2.2], [0.04,2.62], [-0.25,2.72], [-0.46,2.48], 8)));
  const loop = S([].concat(
    cubicPts(apex, [0.50,-4.55], [0.78,-3.75], [0.72,-2.95], 14),
    cubicPts([0.72,-2.95], [0.66,-2.15], [0.40,-1.62], [0.08,-1.28], 14)));
  const C = [0.0, 0.06], start = [0.08, -1.28];
  const a0 = Math.atan2(start[1]-C[1], start[0]-C[0]);
  const rIn = Math.hypot(start[0]-C[0], start[1]-C[1]);
  const total = 1.58 * 2 * Math.PI, rEnd = 0.30;
  const bowl = [];
  for (let i = 0; i <= 90; i++) {
    const t = i / 90, a = a0 - total * t, r = rIn + (rEnd - rIn) * Math.pow(t, 0.8);
    bowl.push([x + (C[0] + 1.07*r*Math.cos(a))*sp, yAnchor + (C[1] + r*Math.sin(a))*sp]);
  }
  const g = strokeGroup(parent);
  el('path', { d: polyPath(spine), 'stroke-width': (0.185*sp).toFixed(1) }, g);
  el('path', { d: polyPath(loop),  'stroke-width': (0.24*sp).toFixed(1) }, g);
  el('path', { d: polyPath(bowl),  'stroke-width': (0.27*sp).toFixed(1) }, g);
  el('circle', { cx: (x-0.52*sp).toFixed(1), cy: (yAnchor+2.38*sp).toFixed(1), r: (0.29*sp).toFixed(1), fill: 'var(--staff-ink)', stroke: 'none' }, g);
}
// F-nøkkel. Origo = F3-linja.
function drawBassClef(parent, x, yAnchor, sp) {
  const S = p => p.map(q => [x + q[0]*sp, yAnchor + q[1]*sp]);
  const body = S([].concat(
    cubicPts([-0.85,-0.35], [-0.5,-1.15], [0.5,-1.25], [0.95,-0.55], 16),
    cubicPts([0.95,-0.55], [1.35,0.1], [1.05,1.2], [0.2,2.0], 18),
    cubicPts([0.2,2.0], [-0.2,2.35], [-0.6,2.55], [-1.0,2.6], 10)));
  const g = strokeGroup(parent);
  el('path', { d: polyPath(body), 'stroke-width': (0.30*sp).toFixed(1) }, g);
  el('circle', { cx: x-0.85*sp, cy: yAnchor, r: 0.40*sp, fill: 'var(--staff-ink)', stroke: 'none' }, g);
  el('circle', { cx: x+1.75*sp, cy: yAnchor-0.5*sp, r: 0.17*sp, fill: 'var(--staff-ink)', stroke: 'none' }, g);
  el('circle', { cx: x+1.75*sp, cy: yAnchor+0.5*sp, r: 0.17*sp, fill: 'var(--staff-ink)', stroke: 'none' }, g);
}
// C-nøkkel. Origo = midtlinja.
function drawAltoClef(parent, x, yAnchor, sp) {
  const S = p => p.map(q => [x + q[0]*sp, yAnchor + q[1]*sp]);
  const g = strokeGroup(parent);
  el('path', { d: polyPath(S([[-1.15,-2.0],[-1.15,2.0]])), 'stroke-width': (0.42*sp).toFixed(1) }, g);
  el('path', { d: polyPath(S([[-0.62,-2.0],[-0.62,2.0]])), 'stroke-width': (0.12*sp).toFixed(1) }, g);
  const up = [].concat(
    cubicPts([-0.55,-2.0], [0.3,-2.25], [0.95,-1.9], [0.95,-1.1], 14),
    cubicPts([0.95,-1.1], [0.95,-0.3], [0.25,-0.05], [-0.35,-0.08], 12));
  const dn = up.map(p => [p[0], -p[1]]).reverse();
  el('path', { d: polyPath(S(up)), 'stroke-width': (0.26*sp).toFixed(1) }, g);
  el('path', { d: polyPath(S(dn)), 'stroke-width': (0.26*sp).toFixed(1) }, g);
  el('circle', { cx: x+0.72*sp, cy: yAnchor-1.35*sp, r: 0.20*sp, fill: 'var(--staff-ink)', stroke: 'none' }, g);
  el('circle', { cx: x+0.72*sp, cy: yAnchor+1.35*sp, r: 0.20*sp, fill: 'var(--staff-ink)', stroke: 'none' }, g);
}
const CLEF_DRAW = { treble: drawTrebleClef, alto: drawAltoClef, bass: drawBassClef };

// Fortegn-glyf (manuelt optisk justert)
function drawAcc(parent, x, y, alt, fontSize, fill) {

  if (alt === 2) { const t = txt(parent, x, y + fontSize*0.34, '×', attrs); t.setAttribute('font-weight', '700'); return t; }
  const sym = alt === 1 ? '♯' : alt === -1 ? '♭' : alt === -2 ? '♭♭' : '♮';
  const dy = (alt === -1 || alt === -2) ? fontSize*0.22 : fontSize*0.34;
  return txt(parent, x, y + dy, sym, attrs);
}

function drawValves(parent, cx, cy, combo, r, gap) {

  const g = el('g', {}, parent);
  for (let v = 1; v <= 3; v++) {
    const pressed = combo !== '0' && combo.indexOf(String(v)) >= 0;
    const x = cx + (v - 2) * gap;
    el('circle', { cx: x, cy, r, fill: pressed ? 'var(--brass)' : 'none', stroke: pressed ? 'var(--brass)' : 'var(--line-strong)', 'stroke-width': 1.6 }, g);
    txt(g, x, cy + r + 11, String(v), { 'text-anchor': 'middle', 'font-size': 9, fill: 'var(--muted)', 'font-family': 'system-ui, sans-serif' });

// Rot i skrevet register: sikter mot nøkkelens midtlinje, begrenset til instrumentets omfang
function chooseWrittenRoot(pc, ins, oct) {
  let lo = ins.lo, hi = ins.hi;
  if (ins.fing === 'brass3') { lo = Math.max(lo, FING_MIN); hi = Math.min(hi, FING_MAX); }
  const span = 12 * oct;
  let hiRoot = hi - span;
  if (hiRoot < lo) hiRoot = lo;
  const target = Math.min(Math.max(CLEFS[ins.clef].centerMidi - 6 * oct, lo), hiRoot);
  let r = lo + ((pc - lo) % 12 + 12) % 12; // minste kandidat >= lo
  let best = r;
  while (r <= hiRoot) {
    if (Math.abs(r - target) < Math.abs(best - target)) best = r;
    r += 12;
  }
  return best;
}
// Rot for klingende visning: sentrér på notesystemet

  const target = CLEFS[ins.clef].centerMidi - 6 * oct;
  return pc + 12 * Math.round((target - pc) / 12);

  html += factHtml(T('ui.factVar'), keyLabel(varT, q === 'dur' ? 'moll' : 'dur'), false, true, 'factVar');
  html += factHtml(T('ui.factDom'), keyLabel(dom, q), false, true, 'factDom');
  html += factHtml(T('ui.factSub'), keyLabel(sub, q), false, true, 'factSub');
  html += factHtml(T('ui.factEnh'), enhSafe ? keyLabel(enhSafe, q) : '—', false, !!enhSafe, enhSafe ? 'factEnh' : null);
  html += '</div>';

  const transposing = isTransposing();
  let mapped;
  if (!transposing) {
    mapped = T('ui.nonTransposing', { instr: instrName(ins.id) });
  } else if (state.view === 'written') {
    mapped = T('ui.soundsAs', {
      key: keyLabel(transposeBy(t, -ins.letters, -ins.semis, q), q),
      interval: intervalName(ins.letters, ins.semis),
      dir: T(ins.semis > 0 ? 'theory.lower' : 'theory.higher'),
    });
  } else {
    mapped = T('ui.writtenAs', {
      instr: instrName(ins.id),
      key: keyLabel(transposeBy(t, ins.letters, ins.semis, q), q),
      interval: intervalName(ins.letters, ins.semis),
      dir: T(ins.semis > 0 ? 'theory.higher' : 'theory.lower'),
    });
    if (ins.fing === 'brass3') mapped += T('ui.fingClause');
  }
  html += `<div class="trumpetline">${ins.group === 'brass' ? '🎺' : '🎼'} ${mapped}</div>`;
  el2.innerHTML = html;

  const bind = (id, fn) => {
    const n = document.getElementById(id);
    if (!n) return;
    n.addEventListener('click', fn);
    n.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } });
  };
  bind('factRel', () => { state.ring = relQ === 'dur' ? 'maj' : 'min'; setTonic(rel, state.ring); });
  bind('factVar', () => { state.ring = q === 'dur' ? 'min' : 'maj'; setTonic(varT, state.ring); });
  bind('factDom', () => setTonic(dom, state.ring));
  bind('factSub', () => setTonic(sub, state.ring));
  if (enhSafe) bind('factEnh', () => setTonic(enhSafe, state.ring));
}

function renderLevels() {
  const wrap = document.getElementById('levels');
  wrap.innerHTML = '';
  const ins = currentInstr();
  const brass = ins.fing === 'brass3';
  const levels = T('levels');
  levels.forEach((L, li) => {
    const d = document.createElement('div');
    d.className = 'level' + (state.level === li + 1 ? ' active' : '');
    let keysHtml = '';
    LEVEL_KEYS[li].forEach((k, ki) => {
      const q = k.ring === 'maj' ? 'dur' : 'moll';
      const t = state.view === 'written' ? k.w : transposeBy(k.w, -ins.letters, -ins.semis, q);
      const lbl = (k.scale === 'dur' || k.scale === 'nmoll' || k.scale === 'hmoll' || k.scale === 'mmoll')
        ? keyLabel(t, q) + (k.scale === 'hmoll' ? ' ' + T('ui.harm') : k.scale === 'mmoll' ? ' ' + T('ui.mel') : '')
        : scaleHeading(t, k.scale, q);
      keysHtml += `<button type="button" data-lvl="${li}" data-ki="${ki}">${lbl}</button>`;
    });
    const tips = brass ? L.brassTips : L.tips;
    d.innerHTML = `<button type="button" class="lvl-head"><span class="lvl-num">${li + 1}</span><h3>${L.name}</h3></button>
      <p><i>${L.sub}</i></p><p>${L.body}</p>
      <ul>${tips.map(t => `<li>${t}</li>`).join('')}</ul>
      <div class="lvl-keys">${keysHtml}</div>`;
    d.querySelector('.lvl-head').addEventListener('click', () => { state.level = li + 1; renderLevels(); });

  });
  wrap.querySelectorAll('.lvl-keys button').forEach(b => {
    b.addEventListener('click', () => {
      const k = LEVEL_KEYS[+b.dataset.lvl][+b.dataset.ki];
      const q = k.ring === 'maj' ? 'dur' : 'moll';
      state.level = +b.dataset.lvl + 1;
      state.scale = k.scale;
      state.ring = k.ring;
      state.tonic = state.view === 'written' ? k.w : transposeBy(k.w, -currentInstr().letters, -currentInstr().semis, q);
      state.concertTonic = null;
      document.getElementById('scaleSel').value = k.scale;
      renderAll();
    });
  });
}

   Teori og oppslag
   ================================================================ */
function nn(letter, alt) { return dispNote({ letter, alt }); }
function theoryContent() {
  const boxes = [];
  const ins = currentInstr();
  const transposing = isTransposing();
  const brass = ins.fing === 'brass3';
  const sharpNames = SHARP_ORDER.map(l => nn(l, 1)).join(' – ');
  const flatNames = FLAT_ORDER.map(l => nn(l, -1)).join(' – ');

  boxes.push({ id: 'tKvint', title: T('theory.tKvintTitle'), html: T('theory.tKvint', {
    exMajor: keyLabel({ letter: 'C', alt: 0 }, 'dur'),
    exMinor: keyLabel({ letter: 'A', alt: 0 }, 'moll'),
  }) });

  let rows = '';
  for (let f = -7; f <= 7; f++) {
    const majT = tonicFromFifths(f);
    const minT = relativeOf(majT, 'maj');
    const accs = sigList(f).map(a => nn(a.letter, a.alt)).join(', ') || '—';
    const cur = (state.ring === 'maj' ? fifthsOf(state.tonic) : fifthsOf(state.tonic) - 3) === f;
    rows += `<tr${cur ? ' class="rowhl"' : ''}><td>${fortegnText(f)}</td><td class="notecell">${keyLabel(majT, 'dur')}</td><td class="notecell">${keyLabel(minT, 'moll')}</td><td>${accs}</td></tr>`;
  }
  boxes.push({ id: 'tFortegn', title: T('theory.tFortegnTitle'), html:
    T('theory.tFortegn', { sharpOrder: sharpNames, flatOrder: flatNames }) +
    `<div class="scroll-x"><table class="ref"><tr><th>${T('theory.thSig')}</th><th>${T('theory.thDur')}</th><th>${T('theory.thMoll')}</th><th>${T('theory.thAccs')}</th></tr>${rows}</table></div>` });

  const q = quality();
  const rel = respellIfNeeded(relativeOf(state.tonic, state.ring), q === 'dur' ? 'moll' : 'dur');
  boxes.push({ id: 'tParallell', title: T('theory.tParallellTitle'), html: T('theory.tParallell', {
    exKey: keyLabel(state.tonic, q),
    exRel: keyLabel(rel, q === 'dur' ? 'moll' : 'dur'),
    exVar1: keyLabel(state.tonic, 'dur'),
    exVar2: keyLabel(respellIfNeeded(state.tonic, 'moll'), 'moll'),
  }) });

  // Transponering
  let thtml;
  if (transposing) {
    thtml = T('theory.tTranspTransposing', {
      instr: instrName(ins.id),
      soundsNote: dispNote(transposeBy({ letter: 'C', alt: 0 }, -ins.letters, -ins.semis, 'dur')),
      interval: intervalName(ins.letters, ins.semis),
      direction: T(ins.semis > 0 ? 'theory.lower' : 'theory.higher'),
      oppositeDirection: T(ins.semis > 0 ? 'theory.higher' : 'theory.lower'),
    });
    let trows = '';
    for (let f = -5; f <= 6; f++) {
      const c = tonicFromFifths(f);
      const w = transposeBy(c, ins.letters, ins.semis, 'dur');
      const cur = state.ring === 'maj' && pcOf(c) === pcOf(state.view === 'written' ? transposeBy(state.tonic, -ins.letters, -ins.semis, 'dur') : state.tonic);
      trows += `<tr${cur ? ' class="rowhl"' : ''}><td class="notecell">${keyLabel(c, 'dur')}</td><td class="notecell">${keyLabel(w, 'dur')}</td><td>${fortegnText(fifthsOf(w))}</td></tr>`;
    }
    thtml += `<div class="scroll-x"><table class="ref"><tr><th>${T('theory.thConcert')}</th><th>${T('theory.thWritten', { instr: instrName(ins.id) })}</th><th>${T('theory.thWrittenSig')}</th></tr>${trows}</table></div>`;
  } else {
    thtml = T('theory.tTranspNon', { instr: instrName(ins.id) });
  }
  thtml += T('theory.tTranspTable');
  boxes.push({ id: 'tTransp', title: T('theory.tTranspTitle', { instr: instrName(ins.id) }), html: thtml });

  if (brass) {
    boxes.push({ id: 'tIntonasjon', title: T('theory.tIntonasjonTitle'), html: T('theory.tIntonasjon', {
      noteD4: nn('D', 0) + '4', noteCiss4: nn('C', 1) + '4', noteE5: nn('E', 0) + '5', noteB5: nn('B', -1) + '5',
      alt3list: [nn('A',0)+'3', nn('E',0)+'4', nn('A',0)+'4', nn('C',1)+'5', nn('A',0)+'5'].join(', '),
    }) });
    let ghtml = T('theory.tGrep', { instr: instrName(ins.id), low: nn('F', 1) + '3', high: nn('G', 0) + '6' });
    if (ins.fourValve) ghtml += T('theory.tGrepPiccoloNote');
    ghtml += '<div class="chartgrid" id="chartGrid"></div>';
    boxes.push({ id: 'tGrep', title: T('theory.tGrepTitle', { low: nn('F', 1) + '3', high: nn('G', 0) + '6' }), html: ghtml });
  }
  return boxes;
}
function renderTheory(writtenSet) {
  const wrap = document.getElementById('theoryBoxes');
  const openSet = {};
  wrap.querySelectorAll('details').forEach(d => { openSet[d.dataset.id] = d.open; });
  wrap.innerHTML = '';
  theoryContent().forEach(b => {
    const d = document.createElement('details');
    d.className = 'tbox';
    d.dataset.id = b.id;
    if (openSet[b.id]) d.open = true;
    d.innerHTML = `<summary>${b.title}</summary><div class="tbody">${b.html}</div>`;
    wrap.appendChild(d);
  });
  renderChart(writtenSet);
}
function renderChart(writtenSet) {
  const grid = document.getElementById('chartGrid');
  if (!grid) return;
  grid.innerHTML = '';
  const useFlats = fifthsOf(state.tonic) < 0;
  for (let m = FING_MIN; m <= FING_MAX; m++) {
    const fing = FINGERINGS[m];
    const sp = spellPitch(m, useFlats);
    const spAlt = spellPitch(m, !useFlats);
    let label = dispNote(sp);
    if (sp.letter !== spAlt.letter || sp.alt !== spAlt.alt) label += ' / ' + dispNote(spAlt);
    const cell = document.createElement('div');
    cell.className = 'chartcell' + (writtenSet && writtenSet.has(m) ? ' inscale' : '');
    cell.innerHTML = `<div class="cname">${label}</div><div class="coct">${T('ui.octaveWord')} ${sp.octave}</div>`;
    const svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('viewBox', '0 0 64 30');
    svg.setAttribute('width', '64'); svg.setAttribute('height', '30');
    drawValves(svg, 32, 10, fing.f, 5, 16);
    cell.appendChild(svg);
    const alt = document.createElement('div');
    alt.className = 'calt';
    alt.textContent = fing.a ? T('ui.alt') + ': ' + fing.a.map(comboText).join(', ') : comboText(fing.f);
    cell.appendChild(alt);
    cell.title = label + ' — ' + T('ui.fingering') + ': ' + comboText(fing.f)
      + (fing.a ? ' (' + T('ui.alt') + '.: ' + fing.a.map(comboText).join(', ') + ')' : '')
      + (fing.i ? '. ' + T('intonation.' + fing.i) : '');
    grid.appendChild(cell);
  }
}

const STEP_NAMES = { 1: '½', 2: '1', 3: '1½', 4: '2', 5: '2½' };
function refreshStatic() {
  document.querySelectorAll('[data-t]').forEach(n => { n.textContent = T(n.getAttribute('data-t')); });
  const ins = currentInstr();
  const vb = document.querySelectorAll('#segView button');
  vb[0].textContent = T('ui.viewConcert');
  vb[1].textContent = T('ui.viewWritten', { instr: instrName(ins.id) });
  const nb = document.querySelectorAll('#segNaming button');
  nb[0].textContent = T('ui.namingNative');
  nb[1].textContent = T('ui.namingIntl');
  document.getElementById('soundingLabel').textContent = T('ui.playSounding', { instr: instrName(ins.id) });
  document.getElementById('tempoVal').textContent = state.tempo + ' ' + T('ui.bpm');
  if (!isPlaying) document.getElementById('playBtn').innerHTML = '<span class="tri">&#9654;</span> ' + T('ui.play');
  const transposing = isTransposing();
  document.getElementById('footerRule').textContent = transposing
    ? T('footer.ruleTransposing', { instr: instrName(ins.id), interval: intervalName(ins.letters, ins.semis), direction: T(ins.semis > 0 ? 'theory.lower' : 'theory.higher') })
    : T('footer.ruleNon', { instr: instrName(ins.id) });
  document.getElementById('htmlRoot').setAttribute('lang', state.lang);
}
function rebuildSelectors() {
  // Skalavelger
  const sel = document.getElementById('scaleSel');
  sel.innerHTML = '';
  SCALE_GROUPS.forEach(g => {
    const og = document.createElement('optgroup');
    og.label = T('scaleGroups.' + g.key);
    g.ids.forEach(id => {
      const o = document.createElement('option');
      o.value = id;
      o.textContent = scaleName(id);
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
  sel.value = state.scale;
  // Familievelger (kort liste) + variantvelger innenfor familien
  const fsel = document.getElementById('familySel');
  fsel.innerHTML = '';
  INSTR_GROUP_ORDER.forEach(gr => {
    const og = document.createElement('optgroup');
    og.label = T('instrumentGroups.' + gr);
    FAMILIES.filter(f => f.group === gr).forEach(f => {
      const o = document.createElement('option');
      o.value = f.id;
      o.textContent = T('families.' + f.id);
      og.appendChild(o);
    });
    fsel.appendChild(og);
  });
  const fam = FAMILY_BY_ID[currentInstr().family];
  fsel.value = fam.id;
  const vsel = document.getElementById('variantSel');
  vsel.innerHTML = '';
  fam.members.forEach(id => {
    const o = document.createElement('option');
    o.value = id;
    o.textContent = instrName(id) + (id === fam.std ? ' (' + T('ui.standard') + ')' : '');
    vsel.appendChild(o);
  });
  vsel.value = state.instrId;
  document.getElementById('variantWrap').style.display = fam.members.length > 1 ? '' : 'none';
}
function renderAll() {
  stopPlayback();
  const ins = currentInstr();
  const q = quality();
  const transposing = isTransposing();
  if (!transposing && state.view !== 'concert') state.view = 'concert';
  // Instrumenter med lite omfang får ikke 2 oktaver
  const canTwoOct = (ins.hi - ins.lo) >= 24;
  if (!canTwoOct && state.oct === 2) state.oct = 1;

  // Skrevet skala (for grep og register); vist skala kan være klingende
  const wTonic = state.view === 'written' ? state.tonic : transposeBy(state.tonic, ins.letters, ins.semis, q);
  const wRoot = chooseWrittenRoot(pcOf(wTonic), ins, state.oct);
  const wBuilt = buildScale(wTonic, state.scale, wRoot, state.oct);
  let built, rootMidi, displayClef = ins.clef;
  if (state.view === 'written' || !transposing) { built = wBuilt; rootMidi = wRoot; }
  else {
    // Klingende visning: samme oktav som instrumentet faktisk klinger i
    rootMidi = wRoot - ins.semis;
    built = buildScale(state.tonic, state.scale, rootMidi, state.oct);
    // Velg nøkkel etter klingende register
    displayClef = (rootMidi + 6 * state.oct) < 58 ? 'bass' : 'treble';
  }

  refreshStatic();
  rebuildSelectors();

  const heading = scaleHeading(state.tonic, state.scale, q);
  renderCircle(state, built.sigF, heading);
  const refs = renderStaff(state, built, wBuilt, displayClef);
  currentNoteRefs = refs.map(r => ({ g: r.g, midi: noteMidi(built.notes[r.idx]) }));
  currentNoteRefs.forEach(c => {
    c.g.addEventListener('click', () => playOne(c.midi));
    c.g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); playOne(c.midi); } });
  });
  renderKeyboard(state, built, rootMidi);
  renderKeyInfo(built);
  renderLevels();

  document.getElementById('staffTitle').innerHTML =
    `${heading} <span class="mode-tag">${state.view === 'written' ? T('ui.viewWritten', { instr: instrName(ins.id) }) : T('ui.viewConcert')}</span>`;
  document.getElementById('staffHint').textContent =
    ins.fing === 'brass3'
      ? (state.view === 'written' ? T('ui.staffHintWritten') : T('ui.staffHintConcert', { instr: instrName(ins.id) }))
      : T('ui.staffHintNoFing');

  const pl = document.getElementById('patternLine');
  if (state.scale === 'krom') {
    pl.innerHTML = `<b>${T('ui.stepsLabel')}:</b> ${T('ui.chromSteps')}`;
  } else {
    const midis = built.notes.map(noteMidi);
    const steps = [];
    for (let i = 1; i < midis.length && i <= SCALES[state.scale].semis.length; i++)
      steps.push(STEP_NAMES[midis[i] - midis[i-1]] || (midis[i] - midis[i-1]) + ' ht');
    pl.innerHTML = `<b>${T('ui.stepsLabel')}:</b> ${steps.join(' – ')} &nbsp;·&nbsp; ${T('ui.stepsLegend')}`;
  }

  let kbdHint;
  if (state.view === 'written' && transposing) {
    kbdHint = T(ins.semis > 0 ? 'ui.kbdWritten' : 'ui.kbdWrittenUp', { interval: intervalName(ins.letters, ins.semis) });
  } else {
    kbdHint = T('ui.kbdConcert');
  }
  document.getElementById('kbdHint').textContent = kbdHint + ' ' + T('ui.kbdRoot');

  const writtenSet = ins.fing === 'brass3' ? new Set(wBuilt.notes.map(noteMidi)) : null;
  renderTheory(writtenSet);

  const slotInfo = findSlot(pcOf(state.tonic), state.ring);
  document.getElementById('enhBtn').disabled = !(slotInfo && CIRCLE[slotInfo.slot][state.ring].length > 1);
  document.getElementById('viewWrap').style.display = transposing ? '' : 'none';
  const octBtns = document.querySelectorAll('#segOct button');
  octBtns[1].disabled = !canTwoOct;
  octBtns.forEach(b => b.setAttribute('aria-pressed', +b.dataset.o === state.oct ? 'true' : 'false'));
  document.getElementById('soundingWrap').style.display = (transposing && state.view === 'written') ? 'inline-flex' : 'none';
  document.getElementById('namingWrap').style.display = state.lang === 'en' ? 'none' : '';
  document.querySelectorAll('#segView button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state.view ? 'true' : 'false'));
  document.querySelectorAll('#segNaming button').forEach(b => b.setAttribute('aria-pressed', b.dataset.n === state.naming ? 'true' : 'false'));
  saveSettings();
}

/* ---------------- Innstillinger ---------------- */
function saveSettings() {
  try {
    localStorage.setItem('notecircle', JSON.stringify({ lang: state.lang, instrId: state.instrId, naming: state.naming }));
  } catch (e) {}
}
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('notecircle') || '{}');
    if (s.lang && I18N[s.lang]) state.lang = s.lang;
    if (s.instrId && INSTR_BY_ID[s.instrId]) state.instrId = s.instrId;
    if (s.naming === 'intl') state.naming = 'intl';
  } catch (e) {}
  const p = new URLSearchParams(location.search);
  const lang = p.get('lang'), instr = p.get('instr');
  if (lang && I18N[lang]) state.lang = lang;
  if (instr && INSTR_BY_ID[instr]) state.instrId = instr;
}

function initSeg(id, attr, fn) {
  const seg = document.getElementById(id);
  seg.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
      fn(b.dataset[attr]);
    });
  });
}
function setInstrument(id) {
  const oldIns = currentInstr();
  const q = quality();
  // Bevar klingende toneart på tvers av instrumentbytte (bufret staving om tilgjengelig)
  let concertTonic = state.view === 'written' ? transposeBy(state.tonic, -oldIns.letters, -oldIns.semis, q) : state.tonic;
  if (state.view === 'written' && state.concertTonic && pcOf(state.concertTonic) === pcOf(concertTonic)) concertTonic = state.concertTonic;
  state.instrId = id;
  const ins = currentInstr();
  if (!(ins.letters || ins.semis)) state.view = 'concert';
  if (state.view === 'written') {
    state.tonic = transposeBy(concertTonic, ins.letters, ins.semis, q);
    state.concertTonic = concertTonic;
  } else {
    state.tonic = concertTonic;
    state.concertTonic = null;
  }
  renderAll();
}
function init() {
  loadSettings();

  // Flaggrad
  const row = document.getElementById('flagRow');
  LANG_ORDER.forEach(code => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'flagbtn';
    b.dataset.lang = code;
    b.setAttribute('aria-label', (I18N[code] && I18N[code].meta && I18N[code].meta.name) || code);
    b.setAttribute('aria-pressed', code === state.lang ? 'true' : 'false');
    b.innerHTML = flagSvg(code);
    b.title = (I18N[code] && I18N[code].meta && I18N[code].meta.name) || code;
    b.addEventListener('click', () => {
      state.lang = code;
      if (state.lang === 'en') state.naming = 'native';
      row.querySelectorAll('.flagbtn').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
      renderAll();
    });
    row.appendChild(b);
  });

  document.getElementById('familySel').addEventListener('change', e => setInstrument(FAMILY_BY_ID[e.target.value].std));
  document.getElementById('variantSel').addEventListener('change', e => setInstrument(e.target.value));
  document.getElementById('scaleSel').addEventListener('change', e => {
