<!doctype html>
<html lang="nb" id="htmlRoot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interaktiv kvintsirkel med skalaer, fortegn, transponering og grep for hele orkesteret — på 7 språk. Interactive circle of fifths for the whole orchestra, in 7 languages.">
<title>Notesirkelen · Notecircle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎺</text></svg>">
<style>
:root {
  --bg: #FBFAF7;
  --surface: #FFFFFF;
  --surface2: #F5F2EA;
  --ink: #26221A;
  --muted: #77705E;
  --line: #E4DFD2;
  --line-strong: #CFC8B5;
  --brass: #A67C1B;
  --brass-strong: #7E5E10;
  --brass-soft: #F1E8CF;
  --slate: #4A6076;
  --slate-strong: #35485A;
  --slate-soft: #E5EBF1;
  --on-brass: #FFFDF5;
  --on-slate: #FFFDF5;
  --staff-ink: #343026;
  --shadow: 0 1px 2px rgba(38,34,26,.05), 0 4px 16px rgba(38,34,26,.06);
  --play: #B05A1F;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #181510;
    --surface: #211D15;
    --surface2: #2A2519;
    --ink: #ECE5D3;
    --muted: #A79C82;
    --line: #3A3424;
    --line-strong: #4C4430;
    --brass: #D9A93C;
    --brass-strong: #E8BE5C;
    --brass-soft: #3B3115;
    --slate: #93ACC7;
    --slate-strong: #B4C8DD;
    --slate-soft: #242E38;
    --on-brass: #241B05;
    --on-slate: #101820;
    --staff-ink: #DDD5C0;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    --play: #E08040;
  }
}
:root[data-theme="dark"] {
  --bg: #181510;
  --surface: #211D15;
  --surface2: #2A2519;
  --ink: #ECE5D3;
  --muted: #A79C82;
  --line: #3A3424;
  --line-strong: #4C4430;
  --brass: #D9A93C;
  --brass-strong: #E8BE5C;
  --brass-soft: #3B3115;
  --slate: #93ACC7;
  --slate-strong: #B4C8DD;
  --slate-soft: #242E38;
  --on-brass: #241B05;
  --on-slate: #101820;
  --staff-ink: #DDD5C0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  --play: #E08040;
}
:root[data-theme="light"] {
  --bg: #FBFAF7;
  --surface: #FFFFFF;
  --surface2: #F5F2EA;
  --ink: #26221A;
  --muted: #77705E;
  --line: #E4DFD2;
  --line-strong: #CFC8B5;
  --brass: #A67C1B;
  --brass-strong: #7E5E10;
  --brass-soft: #F1E8CF;
  --slate: #4A6076;
  --slate-strong: #35485A;
  --slate-soft: #E5EBF1;
  --on-brass: #FFFDF5;
  --on-slate: #FFFDF5;
  --staff-ink: #343026;
  --shadow: 0 1px 2px rgba(38,34,26,.05), 0 4px 16px rgba(38,34,26,.06);
  --play: #B05A1F;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.serif, h1, h2, h3, .keyname {
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "URW Palladio L", Georgia, serif;
}
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 600; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

.page { max-width: 1240px; margin: 0 auto; padding: 20px 20px 60px; }

/* ---------- Header ---------- */
header.top {
  display: flex; flex-wrap: wrap; gap: 16px 28px;
  align-items: flex-end; justify-content: space-between;
  padding: 10px 2px 18px;
  border-bottom: 2px solid var(--ink);
  margin-bottom: 20px;
}
header.top h1 { font-size: 34px; letter-spacing: .01em; line-height: 1.1; }
header.top h1 .clefmark { color: var(--brass); }
header.top .sub { margin: 6px 0 0; color: var(--muted); max-width: 56ch; }
.top-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Segmented control */
.seg {
  display: inline-flex; border: 1px solid var(--line-strong);
  border-radius: 8px; overflow: hidden; background: var(--surface);
}
.seg button {
  border: 0; background: transparent; padding: 7px 13px; cursor: pointer;
  color: var(--muted); white-space: nowrap; line-height: 1.2;
  border-left: 1px solid var(--line);
  transition: background .15s, color .15s;
}
.seg button:first-child { border-left: 0; }
.seg button:disabled { opacity: .35; cursor: default; }
.seg button[aria-pressed="true"] {
  background: var(--ink); color: var(--bg); font-weight: 600;
}
.seg.brassy button[aria-pressed="true"] { background: var(--brass); color: var(--on-brass); }
.seg-label { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); display: block; margin-bottom: 4px; }

/* ---------- Layout ---------- */
main.layout {
  display: grid; gap: 20px;
  grid-template-columns: minmax(330px, 430px) minmax(0, 1fr);
  align-items: start;
}
@media (max-width: 940px) { main.layout { grid-template-columns: minmax(0,1fr); } }
.col { display: grid; gap: 20px; min-width: 0; }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow); padding: 18px;
  min-width: 0;
}
.card > h2 { font-size: 19px; margin-bottom: 4px; }
.card .hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }

/* ---------- Circle ---------- */
.card-circle { padding: 14px 14px 10px; }
#circleSvg { width: 100%; height: auto; display: block; }
#circleSvg .segpath { cursor: pointer; transition: fill .15s, opacity .15s; }
#circleSvg .segpath:hover { opacity: .82; }
#circleSvg text { pointer-events: none; user-select: none; }
.circle-foot {
  display: flex; justify-content: space-between; gap: 10px; align-items: center;
  padding: 8px 6px 4px; flex-wrap: wrap;
}
.circle-foot .legend { display: flex; gap: 14px; color: var(--muted); font-size: 12.5px; }
.legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.dot.dur { background: var(--brass); }
.dot.moll { background: var(--slate); }
button.ghost {
  border: 1px solid var(--line-strong); background: var(--surface);
  border-radius: 7px; padding: 5px 11px; cursor: pointer; font-size: 13px;
  transition: background .15s;
}
button.ghost:hover { background: var(--surface2); }
button.ghost:disabled { opacity: .4; cursor: default; }

/* ---------- Key info ---------- */
#keyInfo .keyname { font-size: 27px; line-height: 1.15; }
#keyInfo .keysub { color: var(--muted); margin: 2px 0 12px; }
.factgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
@media (max-width: 480px) { .factgrid { grid-template-columns: 1fr; } }
.fact {
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
  background: var(--surface2); cursor: default;
}
.fact.clickable { cursor: pointer; transition: border-color .15s, background .15s; }
.fact.clickable:hover { border-color: var(--brass); }
.fact b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
.fact span { font-size: 15px; }
.fact .big { font-size: 17px; font-weight: 600; }
.trumpetline {
  margin-top: 12px; padding: 10px 12px; border-radius: 8px;
  background: var(--brass-soft); border: 1px solid var(--line);
  font-size: 14px;
}
.trumpetline b { color: var(--brass-strong); }

/* ---------- Controls ---------- */
.controls { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: flex-end; }
.ctl { display: block; }
select#scaleSel {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 10px;
  max-width: 250px;
}
input[type="range"] { accent-color: var(--brass); vertical-align: middle; }
.tempoval { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; margin-left: 6px; }
button.play {
  border: 0; border-radius: 8px; padding: 9px 20px 9px 16px; cursor: pointer;
  background: var(--brass); color: var(--on-brass); font-weight: 650; font-size: 15px;
  display: inline-flex; align-items: center; gap: 8px;
  transition: background .15s, transform .05s;
}
button.play:hover { background: var(--brass-strong); }
button.play:active { transform: translateY(1px); }
button.play .tri { font-size: 12px; }
label.chk { display: inline-flex; gap: 7px; align-items: center; font-size: 13.5px; color: var(--muted); cursor: pointer; }
label.chk input { accent-color: var(--brass); }

/* ---------- Staff ---------- */
.staffcard h2 { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.staffcard h2 .mode-tag {
  font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .07em;
  color: var(--slate); background: var(--slate-soft);
  border-radius: 20px; padding: 3px 10px;
}
.staff-wrap { overflow-x: auto; padding: 4px 0 2px; }
.staff-wrap svg { display: block; }
.staffnote { cursor: pointer; }
.staffnote .notehead, .staffnote text { transition: fill .12s; }
.staffnote.playing .notehead { fill: var(--play); }
.staffnote.playing .nlabel { fill: var(--play); }
.staffnote:hover .notehead { fill: var(--brass-strong); }
.pattern-line { color: var(--muted); font-size: 13px; margin: 8px 2px 0; }
.pattern-line b { color: var(--ink); }

/* ---------- Keyboard ---------- */
#kbdSvg { width: 100%; height: auto; display: block; }

/* ---------- Levels ---------- */
.levels { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
@media (max-width: 1020px) { .levels { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 520px) { .levels { grid-template-columns: minmax(0,1fr); } }
.level {
  border: 1px solid var(--line); border-radius: 9px; padding: 13px 14px 12px;
  background: var(--surface2); display: flex; flex-direction: column; gap: 8px;
  position: relative;
}
.level.active { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); background: var(--surface); }
.level .lvl-head {
  display: flex; align-items: baseline; gap: 8px;
  background: none; border: 0; padding: 0; cursor: pointer; text-align: left;
  font: inherit; color: inherit; width: 100%;
}
.level .lvl-num {
  font-family: "Iowan Old Style", Palatino, Georgia, serif;
  font-size: 24px; color: var(--brass); font-weight: 700; line-height: 1;
}
.level h3 { font-size: 16px; }
.level p { margin: 0; font-size: 13px; color: var(--muted); }
.level ul { margin: 0; padding-left: 17px; font-size: 12.5px; color: var(--muted); display: grid; gap: 3px; }
.level .lvl-keys { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; padding-top: 4px; }
.lvl-keys button {
  border: 1px solid var(--line-strong); background: var(--surface);
  border-radius: 6px; padding: 2px 8px; font-size: 12.5px; cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.lvl-keys button:hover { border-color: var(--brass); color: var(--brass-strong); }

/* ---------- Theory / reference ---------- */
.theory { margin-top: 26px; display: grid; gap: 12px; }
.theory h2.sect {
  font-size: 22px; padding-bottom: 8px; border-bottom: 2px solid var(--ink);
  margin-bottom: 6px;
}
details.tbox {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow);
}
details.tbox summary {
  cursor: pointer; padding: 14px 18px; font-weight: 600; font-size: 16px;
  font-family: "Iowan Old Style", Palatino, Georgia, serif;
  list-style: none; display: flex; align-items: center; gap: 10px;
}
details.tbox summary::-webkit-details-marker { display: none; }
details.tbox summary::before {
  content: ""; width: 8px; height: 8px; flex: 0 0 auto;
  border-right: 2px solid var(--brass); border-bottom: 2px solid var(--brass);
  transform: rotate(-45deg); transition: transform .15s; margin-top: -2px;
}
details.tbox[open] summary::before { transform: rotate(45deg); }
details.tbox .tbody { padding: 2px 18px 18px; }
details.tbox .tbody > p { max-width: 72ch; margin: 8px 0; }
details.tbox .tbody code {
  background: var(--surface2); border: 1px solid var(--line);
  border-radius: 5px; padding: 1px 6px; font-size: 13px;
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
.scroll-x { overflow-x: auto; }
table.ref { border-collapse: collapse; font-size: 13.5px; min-width: 480px; }
table.ref th, table.ref td { border: 1px solid var(--line); padding: 6px 11px; text-align: left; }
table.ref th { background: var(--surface2); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
table.ref td { font-variant-numeric: tabular-nums; }
table.ref td.notecell { font-weight: 600; }
table.ref tr.rowhl td { background: var(--brass-soft); }

/* Fingering chart grid */
.chartgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
.chartcell {
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 6px 7px;
  display: grid; justify-items: center; gap: 4px; background: var(--surface2);
  transition: border-color .15s;
}
.chartcell.inscale { border-color: var(--brass); background: var(--brass-soft); }
.chartcell .cname { font-weight: 650; font-size: 14px; line-height: 1.2; text-align: center; }
.chartcell .coct { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chartcell svg { display: block; }
.chartcell .calt { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }

.flags { display: flex; gap: 6px; flex-wrap: wrap; }
.flagbtn {
  border: 1px solid var(--line-strong); border-radius: 6px; padding: 3px;
  background: var(--surface); cursor: pointer; line-height: 0;
  transition: transform .1s, border-color .15s;
}
.flagbtn svg { display: block; border-radius: 3px; }
.flagbtn:hover { transform: translateY(-1px); }
.flagbtn[aria-pressed="true"] { border-color: var(--brass); box-shadow: 0 0 0 2px var(--brass); }
select#familySel, select#variantSel {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 10px;
  max-width: 280px;
}
footer.foot {
  margin-top: 34px; padding-top: 14px; border-top: 1px solid var(--line);
  color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 6px 24px;
}
</style>
</head>
<body>
<div class="page">
<header class="top">
  <div>
    <h1><span class="clefmark">&#9835;</span> Notesirkelen</h1>
    <p class="sub" data-t="ui.subtitle"></p>
  </div>
  <div class="top-controls">
    <div>
      <span class="seg-label" data-t="ui.language">Språk</span>
      <div class="flags" id="flagRow" role="group"></div>
    </div>
    <div>
      <span class="seg-label" data-t="ui.instrument">Instrument</span>
      <select id="familySel"></select>
      <div id="variantWrap" style="margin-top:6px">
        <span class="seg-label" data-t="ui.variant">Variant</span>
        <select id="variantSel"></select>
      </div>
    </div>
    <div id="viewWrap">
      <span class="seg-label" data-t="ui.view">Visning</span>
      <div class="seg brassy" id="segView" role="group">
        <button type="button" data-v="concert" aria-pressed="true"></button>
        <button type="button" data-v="written" aria-pressed="false"></button>
      </div>
    </div>
    <div id="namingWrap">
      <span class="seg-label" data-t="ui.naming">Notenavn</span>
      <div class="seg" id="segNaming" role="group">
        <button type="button" data-n="native" aria-pressed="true"></button>
        <button type="button" data-n="intl" aria-pressed="false"></button>
      </div>
    </div>
  </div>
</header>

<main class="layout">
  <section class="col">
    <div class="card card-circle">
      <h2 data-t="ui.circleTitle"></h2>
      <p class="hint" data-t="ui.circleHint"></p>
      <svg id="circleSvg" viewBox="0 0 560 560" role="img" aria-label="Kvintsirkelen"></svg>
      <div class="circle-foot">
        <div class="legend">
          <span><span class="dot dur"></span><span data-t="ui.dur"></span></span>
          <span><span class="dot moll"></span><span data-t="ui.moll"></span></span>
        </div>
        <button type="button" class="ghost" id="enhBtn" data-t="ui.enhSwap"></button>
      </div>
    </div>
    <div class="card" id="keyInfo"></div>
  </section>

  <section class="col">
    <div class="card controls">
      <label class="ctl">
        <span class="seg-label" data-t="ui.scale"></span>
        <select id="scaleSel"></select>
      </label>
      <div class="ctl">
        <span class="seg-label" data-t="ui.range"></span>
        <div class="seg" id="segOct">
          <button type="button" data-o="1" aria-pressed="true" data-t="ui.oct1"></button>
          <button type="button" data-o="2" aria-pressed="false" data-t="ui.oct2"></button>
        </div>
      </div>
      <div class="ctl">
        <span class="seg-label" data-t="ui.direction"></span>
        <div class="seg" id="segDir">
          <button type="button" data-d="up" aria-pressed="true" data-t="ui.dirUp"></button>
          <button type="button" data-d="updown" aria-pressed="false" data-t="ui.dirUpDown"></button>
        </div>
      </div>
      <label class="ctl">
        <span class="seg-label" data-t="ui.tempo"></span>
        <input type="range" id="tempo" min="40" max="208" value="96" step="4">
        <span class="tempoval" id="tempoVal"></span>
      </label>
      <button type="button" class="play" id="playBtn"><span class="tri">&#9654;</span> <span id="playLabel"></span></button>
      <label class="chk" id="soundingWrap"><input type="checkbox" id="soundingChk" checked> <span id="soundingLabel"></span></label>
    </div>

    <div class="card staffcard">
      <h2 id="staffTitle"></h2>
      <p class="hint" id="staffHint"></p>
      <div class="staff-wrap"><svg id="staffSvg"></svg></div>
      <p class="pattern-line" id="patternLine"></p>
    </div>

    <div class="card">
      <h2 data-t="ui.keyboard"></h2>
      <p class="hint" id="kbdHint"></p>
      <svg id="kbdSvg" viewBox="0 0 700 130" role="img" aria-label="Klaviatur med skalatoner"></svg>
    </div>
  </section>
</main>

<section class="card" style="margin-top:20px">
  <h2 data-t="ui.levelsTitle"></h2>
  <p class="hint" data-t="ui.levelsHint"></p>
  <div class="levels" id="levels"></div>
</section>

<section class="theory">
  <h2 class="sect serif" data-t="ui.theoryTitle"></h2>
  <div id="theoryBoxes"></div>
</section>

<footer class="foot">
  <span id="footerRule"></span>
  <span data-t="ui.footerTuning"></span>
</footer>
</div>

<script>
'use strict';
const LETTERS = ['C','D','E','F','G','A','B'];
const LETTER_SEMIS = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
const LETTER_FIFTHS = { C:0, D:2, E:4, F:-1, G:1, A:3, B:5 };
const SHARP_ORDER = ['F','C','G','D','A','E','B'];
const FLAT_ORDER  = ['B','E','A','D','G','C','F'];
// Faste fortegn i G-nøkkel: diatonisk posisjon (oktav*7 + bokstavindeks)
const SHARP_SIG_DI = [38, 35, 39, 36, 33, 37, 34]; // F5 C5 G5 D5 A4 E5 B4
const FLAT_SIG_DI  = [34, 37, 33, 36, 32, 35, 31]; // B4 E5 A4 D5 G4 C5 F4

function noteMidi(n) { return 12 * (n.octave + 1) + LETTER_SEMIS[n.letter] + n.alt; }
function diaIndex(n) { return n.octave * 7 + LETTERS.indexOf(n.letter); }
function fifthsOf(t) { return LETTER_FIFTHS[t.letter] + 7 * t.alt; }
function pcOf(t) { return ((LETTER_SEMIS[t.letter] + t.alt) % 12 + 12) % 12; }

// Tonika fra kvintindeks: ...-7=Cess, 0=C, 7=Ciss
function tonicFromFifths(f) {
  const idx = (((f + 1) % 7) + 7) % 7;
  return { letter: 'FCGDAEB'[idx], alt: Math.floor((f + 1) / 7) };
}
// Faste fortegn for kvintindeks f: {bokstav: alterasjon}
function sigMap(f) {
  const m = { C:0, D:0, E:0, F:0, G:0, A:0, B:0 };
  if (f > 0) for (let i = 0; i < f; i++) m[SHARP_ORDER[i]] = 1;
  if (f < 0) for (let i = 0; i < -f; i++) m[FLAT_ORDER[i]] = -1;
  return m;
}
function sigList(f) {
  const out = [];
  if (f > 0) for (let i = 0; i < Math.min(f, 7); i++) out.push({ letter: SHARP_ORDER[i], alt: 1, di: SHARP_SIG_DI[i] });
  if (f < 0) for (let i = 0; i < Math.min(-f, 7); i++) out.push({ letter: FLAT_ORDER[i], alt: -1, di: FLAT_SIG_DI[i] });
  return out;
}
// Respell tonika om tonearten havner utenfor de 15 standardsignaturene.
// quality: 'dur' eller 'moll' — moll-signaturen ligger 3 kvinter under tonika.
function normalizeTonic(out, quality) {
  const off = quality === 'moll' ? 3 : 0;
  const sig = fifthsOf(out) - off;
  if (sig > 7) return tonicFromFifths(fifthsOf(out) - 12);
  if (sig < -7) return tonicFromFifths(fifthsOf(out) + 12);
  return out;
}
// Transponer en stavemåte opp en stor sekund (klingende -> skrevet for B♭)
function upMajorSecond(t, quality) {
  const i = LETTERS.indexOf(t.letter);
  const nl = LETTERS[(i + 1) % 7];
  const carry = (i + 1 > 6) ? 12 : 0;
  const out = { letter: nl, alt: LETTER_SEMIS[t.letter] + t.alt + 2 - (LETTER_SEMIS[nl] + carry) };
  return normalizeTonic(out, quality || 'dur');
}

// 12 posisjoner med klokka fra C. maj/min: liste av stavemåter (enharmoniske varianter)
const CIRCLE = [
  { maj: [{letter:'C',alt:0}],                    min: [{letter:'A',alt:0}] },
  { maj: [{letter:'G',alt:0}],                    min: [{letter:'E',alt:0}] },
  { maj: [{letter:'D',alt:0}],                    min: [{letter:'B',alt:0}] },
  { maj: [{letter:'A',alt:0}],                    min: [{letter:'F',alt:1}] },
  { maj: [{letter:'E',alt:0}],                    min: [{letter:'C',alt:1}] },
  { maj: [{letter:'B',alt:0},{letter:'C',alt:-1}], min: [{letter:'G',alt:1},{letter:'A',alt:-1}] },
  { maj: [{letter:'F',alt:1},{letter:'G',alt:-1}], min: [{letter:'D',alt:1},{letter:'E',alt:-1}] },
  { maj: [{letter:'D',alt:-1},{letter:'C',alt:1}], min: [{letter:'B',alt:-1},{letter:'A',alt:1}] },
  { maj: [{letter:'A',alt:-1}],                   min: [{letter:'F',alt:0}] },
  { maj: [{letter:'E',alt:-1}],                   min: [{letter:'C',alt:0}] },
  { maj: [{letter:'B',alt:-1}],                   min: [{letter:'G',alt:0}] },
  { maj: [{letter:'F',alt:0}],                    min: [{letter:'D',alt:0}] },
];
function findSlot(pc, ring) {
  for (let s = 0; s < 12; s++) {
    const arr = CIRCLE[s][ring];
    for (let e = 0; e < arr.length; e++) if (pcOf(arr[e]) === pc) return { slot: s, enh: e };
  }
  return null;
}

/* ---------------- Notenavn ---------------- */
function norName(letter, alt) {
  if (letter === 'B') {
    if (alt === 0) return 'H';
    if (alt === 1) return 'Hiss';
    if (alt === 2) return 'Hississ';
    if (alt === -1) return 'B';
    return 'Bess'; // H♭♭ (sjelden)
  }
  if (alt === 0) return letter;
  if (alt > 0) return letter + 'iss'.repeat(alt);
  let s = letter;
  for (let i = 0; i < -alt; i++) s += (i === 0 && (letter === 'E' || letter === 'A')) ? 'ss' : 'ess';
  return s;
}
function accSymbol(alt) {
  if (alt === 1) return '♯';
  if (alt === -1) return '♭';
  if (alt === 2) return '×';        // dobbeltkryss (×)
  if (alt === -2) return '♭♭'; // dobbelt-b
  return '';
}
function intlName(letter, alt) { return letter + accSymbol(alt); }
function dispNote(t, naming) { return naming === 'nor' ? norName(t.letter, t.alt) : intlName(t.letter, t.alt); }
// Tonikanavn i skalaoverskrifter: moll-baserte skalaer får liten forbokstav på norsk
function scaleTonicName(t, scaleId, naming) {
  const n = dispNote(t, naming);
  return (naming === 'nor' && SCALES[scaleId].ring === 'min') ? n.charAt(0).toLowerCase() + n.slice(1) : n;
}
function keyLabel(t, quality, naming) {
  const n = dispNote(t, naming);
  if (quality === 'dur') return n + '-dur';
  return (naming === 'nor' ? n.toLowerCase() : n) + '-moll';
}
function fortegnText(f) {
  if (f === 0) return 'ingen faste fortegn';
  const n = Math.abs(f);
  if (f > 0) return n + (n === 1 ? ' kryss' : ' kryss');
  return n + (n === 1 ? ' b' : ' b-er');
}

// Kromatisk staving uten dobbeltfortegn
const SHARP_SPELL = [['C',0],['C',1],['D',0],['D',1],['E',0],['F',0],['F',1],['G',0],['G',1],['A',0],['A',1],['B',0]];
const FLAT_SPELL  = [['C',0],['D',-1],['D',0],['E',-1],['E',0],['F',0],['G',-1],['G',0],['A',-1],['A',0],['B',-1],['B',0]];
function spellPitch(midi, useFlats) {
  const pc = ((midi % 12) + 12) % 12;
  const [letter, alt] = (useFlats ? FLAT_SPELL : SHARP_SPELL)[pc];
  return { letter, alt, octave: Math.floor(midi / 12) - 1 };
}

// Bygg skalaen fra en tonika-stavemåte. Returnerer {notes, sigF, degrees}
function buildScale(tonic, typeId, rootMidi, octaves) {
  const def = SCALES[typeId];
  // Faste fortegn
  let sigF;
  if (def.sigOff === 'none') sigF = 0;
  else {
    sigF = fifthsOf(tonic) - def.sigOff;
    if (sigF > 7 || sigF < -7) sigF = 0; // utenfor standard -> løse fortegn i stedet
  }
  const notes = [];
  const degrees = [];
  if (typeId === 'krom') {
    const useFlats = fifthsOf(tonic) < 0;
    const span = 12 * octaves;
    for (let i = 0; i <= span; i++) {
      notes.push(spellPitch(rootMidi + i, useFlats));
      degrees.push(i % 12 === 0 ? '1' : '');
    }
    return { notes, sigF: 0, degrees };
  }
  const Li = LETTERS.indexOf(tonic.letter);
  const baseOct = Math.round((rootMidi - LETTER_SEMIS[tonic.letter] - tonic.alt) / 12) - 1;
  const MAJ = [0, 2, 4, 5, 7, 9, 11];
  const oneOct = def.semis.map((s, i) => ({ s, lo: def.lets[i] }));
  const seq = [];
  for (let o = 0; o < octaves; o++) oneOct.forEach(x => seq.push({ s: x.s + 12 * o, lo: x.lo + 7 * o }));
  seq.push({ s: 12 * octaves, lo: 7 * octaves }); // toppen: tonika
  for (const { s, lo } of seq) {
    const letter = LETTERS[(Li + lo) % 7];
    const octave = baseOct + Math.floor((Li + lo) / 7);
    const target = rootMidi + s;
    notes.push({ letter, alt: target - (12 * (octave + 1) + LETTER_SEMIS[letter]), octave });
    const dNum = (lo % 7) + 1;
    const diff = ((s % 12) - MAJ[lo % 7] + 24) % 12;
    const dAcc = diff === 0 ? '' : diff === 11 ? '♭' : diff === 1 ? '♯' : diff === 10 ? '♭♭' : '';
    degrees.push((s % 12 === 0 && dNum === 1) ? '1' : dAcc + dNum);
  }
  return { notes, sigF, degrees };
}

// Velg rot-oktav slik at alt ligger godt på G-nøkkelsystemet og innenfor trompetregisteret
function chooseRootMidi(tonic, view, octaves) {
  const pc = pcOf(tonic);
  let lo;
  if (octaves === 2) lo = (view === 'written') ? 54 : 52;
  else lo = 57;
  let m = lo + ((pc - lo) % 12 + 12) % 12;
  return m;
}

/* ---------------- Generell transponering ---------------- */
// written = concert + (letters, semis). quality styrer respelling-grensen.
function transposeBy(t, letters, semis, quality) {
  if (!letters && !semis) return { letter: t.letter, alt: t.alt };
  const i = LETTERS.indexOf(t.letter);
  const li = i + letters;
  const nl = LETTERS[((li % 7) + 7) % 7];
  const octShift = Math.floor(li / 7);
  const base = LETTER_SEMIS[t.letter] + t.alt;
  const naturalRel = LETTER_SEMIS[nl] + 12 * octShift;
  return normalizeTonic({ letter: nl, alt: base + semis - naturalRel }, quality || 'dur');
}
// Intervallnavn-komponenter fra (letters, semis), absoluttverdier
function intervalParts(letters, semis) {
  const L = Math.abs(letters), S = Math.abs(semis);
  const octs = Math.floor(L / 7);
  const rem = L % 7, remS = S - 12 * octs;
  const PERF = { 0: 0, 3: 5, 4: 7 };
  let qual = 'maj';
  if (rem in PERF) qual = 'perf';
  else { const MAJ = { 1: 2, 2: 4, 5: 9, 6: 11 }; qual = (remS === MAJ[rem]) ? 'maj' : 'min'; }
  return { octs, num: rem, qual };
}

dover i klassisk tradisjon).</p>","tTranspTitle":"Transponering: {instr} og andre instrumenter","tTranspTransposing":"<p>{instr} er et <b>transponerende instrument</b>: en skrevet C klinger som {soundsNote} — {interval} {direction}. For å få en ønsket klingende tone skriver man derfor {interval} {oppositeDirection}.</p>","tTranspNon":"<p>{instr} er <b>ikke-transponerende</b>: skrevet note og klingende tone er den samme. Tabellen under viser likevel hvordan transponerende instrumenter forholder seg til klingende tonehøyde.</p>","tTranspTable":"<p>Samme prinsipp gjelder resten av orkesteret: <b>klarinett i B♭</b> (stor sekund opp), <b>valthorn i F</b> (ren kvint opp), <b>altsaksofon i E♭</b> (stor sekst opp), <b>kontrabass</b> (en oktav opp). Tommelfingerregel: instrumentets navn er den klingende tonen når det spiller en skrevet C.</p>","thConcert":"Klingende (konsert)","thWritten":"Skrevet for {instr}","thWrittenSig":"Skrevne fortegn","lower":"lavere","higher":"høyere","up":"opp","down":"ned","tIntonasjonTitle":"Intonasjon på ventilmessing","tIntonasjon":"<p>Ventilene senker tonen med faste rørlengder, men kombinasjoner blir for korte — derfor er noen grep systematisk ustemte:</p><p><b>1·3 og 1·2·3 er høye.</b> Skrevet {noteD4} (1·3) og {noteCiss4} (1·2·3) er de beryktede: skyv ut 3.-ventilsleiden (ca. 1–1,5 cm for 1·3, 2–2,5 cm for 1·2·3).</p><p><b>5. deltone er lav.</b> Skrevet {noteE5} på åpent grep ligger ~14 cent lavt — juster med leppa, eller bruk 1·2 (6. deltone) som alternativgrep.</p><p><b>7. deltone unngås.</b> Åpen {noteB5} ligger ~31 cent lavt og brukes bare til jazz-effekter («shake») — spill den med 1. ventil.</p><p>3. ventil alene ≈ 1·2 og brukes som alternativgrep for triller og intonasjon ({alt3list}).</p>","tGrepTitle":"Full grepstabell (kromatisk, skrevet {low}–{high})","tGrep":"<p>Alle grep for {instr}, fra laveste tone ({low}) og opp i høyt register. Toner som inngår i valgt skala er uthevet. Hold pekeren over en celle for alternativgrep og inton :"Trombon","basstrombone":"Bastrombon","eufonium_c":"Eufonium (basklav)","eufonium_bb":"Eufonium/baryton i B♭ (G-klav)","tuba":"Tuba (basklav)","tuba_eb":"Tuba i E♭ (G-klav, brassband)","tuba_bb":"Tuba i B♭ (G-klav, brassband)","piano":"Piano","klokkespill":"Klockspel","xylofon":"Xylofon","pauker":"Pukor"},"levels":[{"name":"Nybörjare","sub":"kulturskola, år 1–2","body":"Dur i C, F och G (noterat), a-moll mot slutet. En oktav, lugnt och jämnt (♩ ≈ 60–72). Klang före teknik.","tips":["Långa toner först: 8+ slag per ton med lugn, jämn luftström eller jämna stråk.","Sjung skalan innan du spelar den — hör tonen innan du skapar den.","Använd spegel och lyssna: jämn klang på varje ton är viktigare än tempo."],"brassTips":["Långa toner först: 8+ slag på g¹ och c¹ (låga C) med lugn, öppen luftström.","Läppbindningar på öppna deltoner (c¹–g¹–c²) utan ventiler före skalan.","Sjung eller ”buzza” skalan på munstycket innan du spelar den."]},{"name":"Övad","sub":"grad 3–5 / mellannivå","body":"Dur till 3–4 förtecken (blåsorkestertonarterna), moll i harmonisk och melodisk form, kromatisk skala, dominantseptimackord. Åttondelar ♩ ≈ 80–100, både bundet och artikulerat.","tips":["Öva skalan bundet först, sedan artikulerat i samma tempo — alltid med metronom.","Öva också uppifrån och ned — nedvägen avslöjar ojämnheter.","Planera andningen/stråket: sista tonen lika full som första."],"brassTips":["Dagliga läppbindningar (Arban/Schlossberg) på alla ventilkombinationer.","Öva skalan bundet först, sedan artikulerat i samma tempo — alltid med metronom.","Planera andningen: högst ett andetag per oktavlöpning, och sista tonen lika full som första."]},{"name":"Avancerad","sub":"musikgymnasium / grad 6–8","body":"Alla 12 dur- och molltonarter utantill, arpeggion (dur, moll, dom7, dim7). Två oktaver där registret tillåter. Sextondelar ♩ ≈ 80–112, blandade artikulationer.","tips":["Öva skalorna också i tersmönster och med rytmvariationer.","Två oktaver kommer av kontroll och avspändhet — inte kraft.","Kyrkotonarterna: samma förtecken, ny utgångspunkt — hör skillnaden."],"brassTips":["Öva skalorna också uppifrån och ned, och i tersmönster.","Två oktaver kommer av andningsstöd och flexibilitet — inte munstyckstryck.","Kyrkotonarterna: samma förtecken, ny utgångspunkt — hör skillnaden."]},{"name":"Professionell","sub":"musikhögskola / daglig rutin","body":"Alla tonarter i alla modi, jazz- och symmetriska skalor, mönsterstudier genom hela registret — i alla artikulationer och nyanser.","tips":["Rotera: en tonart per dag, genom alla modi och arpeggion.","Öva i alla nyanser — pianissimo avslöjar mest.","Transponera etyder: tänk klingande och noterat samtidigt."],"brassTips":["Clarke-studie nr 2 genom alla tonarter — pianissimo och obesvärat.","Rotera: en tonart per dag, genom alla modi och arpeggion.","Transponera etyder: tänk klingande och noterat samtidigt."]}],"theory":{"tKvintTitle":"Så läser du kvintcirkeln","tKvint":"<p>Kvintcirkeln ordnar alla tonarter efter hur många fasta förtecken de har. Ett steg <b>medurs</b> är en ren kvint upp — och ett kors mer (eller ett b mindre). Ett steg <b>moturs</b> är en kvint ned — ett b mer.</p><p>Granntonarter delar sex av sju toner och klingar därför nära besläktade. Det är skälet till att <b>dominanten (D)</b> — kvinten över — och <b>subdominanten (S)</b> — kvinten under — är de viktigaste ackordfunktionerna vid sidan av tonikan.</p><p>Yttre och inre ring på samma plats delar fasta förtecken: det är <b>parallelltonarter</b> (t.ex. {exMajor} och {exMinor}). Längst ned i cirkeln möts kors- och b-sidan i de <b>enharmoniska</b> tonarterna: samma klingande toner, två skrivsätt.</p>","tFortegnTitle":"Förtecken: ordning och alla tonarter","tFortegn":"<p>Korsen kommer alltid i ordningen <b>{sharpOrder}</b> (kvintvis uppåt). B-förtecknen kommer i omvänd ordning: <b>{flatOrder}</b> (kvintvis nedåt).</p><p>Två användbara minnesregler: <b>sista korset</b> ligger ett halvtonsteg under grundtonen i dur (ledtonen). <b>Näst sista b:et</b> <i>är</i> durtonarten.</p>","thSig":"Fasta förtecken","thDur":"Dur","thMoll":"Moll","thAccs":"Förtecknen","tParallellTitle":"Parallelltonart och varianttonart","tParallell":"<p>I svensk (och tysk) teori betyder <b>parallelltonart</b> dur- och molltonarten som delar fasta förtecken, med grundtoner en liten ters från varandra: {exKey} ↔ {exRel}. (På engelska heter detta ”relative key” — var uppmärksam vid översättningar!)</p><p><b>Varianttonart</b> är dur och moll på <i>samma grundton</i>, t.ex. {exVar1} och {exVar2} — samma tonika, men tre förteckens skillnad.</p><p>Moll finns i tre former: <b>ren</b> (som parallell dur), <b>harmonisk</b> (höjt 7:e steg — ger ledton och en karakteristisk överstigande sekund) och <b>melodisk</b> (höjt 6:e och 7:e steg uppåt; ren form nedåt i klassisk tradition).</p>","tTranspTitle":"Transponering: {instr} och andra instrument","tTranspTransposing":"<p>{instr} är ett <b>transponerande instrument</b>: ett noterat C klingar som {soundsNote} — {interval} {direction}. För att få en önskad klingande ton noterar man därför {interval} {oppositeDirection}.</p>","tTranspNon":"<p>{instr} är <b>icke-transponerande</b>: noterad not och klingande ton är densamma. Tabellen nedan visar ändå hur transponerande instrument förhåller sig till klingande tonhöjd.</p>","tTranspTable":"<p>Samma princip gäller resten av orkestern: <b>klarinett i B♭</b> (stor sekund upp), <b>valthorn i F</b> (ren kvint upp), <b>altsaxofon i E♭</b> (stor sext upp), <b>kontrabas</b> (en oktav upp). Tumregel: instrumentets namn är den klingande tonen när det spelar ett noterat C.</p>","thConcert":"Klingande (konsert)","thWritten":"Noterat för {instr}","thWrittenSig":"Noterade förtecken","lower":"lägre","higher":"högre","up":"upp","down":"ned","tIntonasjonTitle":"Intonation på bleckblås med ventiler","tIntonasjon":"<p>Ventilerna sänker tonen med fasta rörlängder, men kombinationer blir för korta — därför spelar vissa grepp systematiskt falskt:</p><p><b>1·3 och 1·2·3 är höga.</b> Noterat {noteD4} (1·3) och {noteCiss4} (1·2·3) är de ökända: skjut ut tredje ventilbygeln (ca 1–1,5 cm för 1·3, 2–2,5 cm för 1·2·3).</p><p><b>5:e deltonen är låg.</b> Noterat {noteE5} med öppet grepp ligger ~14 cent lågt — justera med läppen, eller använd 1·2 (6:e deltonen) som alternativgrepp.</p><p><b>7:e deltonen undviks.</b> Öppet {noteB5} ligger ~31 cent lågt och används bara till jazzeffekter (”shake”) — spela den med första ventilen.</p><p>Tredje ventilen ensam ≈ 1·2 och används som alternativgrepp för drillar och intonation ({alt3list}).</p>","tGrepTitle":"Fullständig grepptabell (kromatisk, noterat {low}–{high})","tGrep":"<p>Alla grepp för {instr}, från lägsta tonen ({low}) och upp i högt register. Toner som ingår i vald skala är markerade. Håll pekaren över en cell för alternativgrepp och intonationstips. Oktavtal enligt internationell standard: C4 = ettstrukna c.</p>","tGrepPiccoloNote":"<p>Obs: piccolatrumpet har vanligtvis en fjärde ventil (sänker en ren kvart) som utökar registret nedåt.</p>"},"footer":{"ruleTransposing":"{instr}: noterad ton klingar {interval} {direction}.","ruleNon":"{instr}: noterad och klingande tonhöjd är densamma."},"families":{"trumpet":"Trumpet","horn":"Valthorn","trombone":"Trombon","euphonium":"Eufonium","tuba":"Tuba","flute":"Flöjt","oboe":"Oboe","clarinet":"Klarinett","bassoon":"Fagott","sax":"Saxofon","violinF":"Violin","violaF":"Viola","celloF":"Cello","dbassF":"Kontrabas","pianoF":"Piano","percussion":"Slagverk"}},"da":{"meta":{"lang":"da","name":"Dansk"},"ui":{"title":"Nodecirklen","subtitle":"Tonearter, skalaer, transponering og greb til hele orkestret. Vælg sprog og instrument, klik i kvintcirklen — og se noder, fortegn og greb fra begynderniveau til professionelt niveau.","language":"Sprog","instrument":"Instrument","view":"Visning","viewConcert":"Klingende (C)","viewWritten":"Noteret for {instr}","naming":"Nodenavne","namingNative":"Dansk (H · B · Fis)","namingIntl":"International (B · B♭ · F♯)","scale":"Skala" ,"instruments":{"violin":"Violin","viola":"Bratsch","cello":"Cello","dbass":"Kontrabas","piccolo":"Piccolofløjte","flute":"Fløjte","altflute":"Altfløjte i G","oboe":"Obo","englhorn":"Engelskhorn i F","klar_bb":"Klarinet i B♭","klar_a":"Klarinet i A","klar_eb":"Klarinet i E♭","bassklar":"Basklarinet i B♭","fagott":"Fagot","kontrafag":"Kontrafagot","sopransax":"Sopransaxofon i B♭","altsax":"Altsaxofon i E♭","tenorsax":"Tenorsaxofon i B♭","barisax":"Barytonsaxofon i E♭","tromp_bb":"Trompet i B♭","tromp_c":"Trompet i C","tromp_d":"Trompet i D","tromp_eb":"Trompet i E♭","picctromp":"Piccolotrompet i B♭","kornett_bb":"Kornet i B♭","kornett_eb":"Soprankornet i E♭","flygelhorn":"Flygelhorn i B♭","basstromp":"Bastrompet i B♭","horn_f":"Valdhorn i F","althorn":"Althorn i E♭","trombone":"Basun","basstrombone":"Basbasun","eufonium_c":"Euphonium (basnøgle)","eufonium_bb":"Euphonium/baryton i B♭ (G-nøgle)","tuba":"Tuba (basnøgle)","tuba_eb":"Tuba i E♭ (G-nøgle, brassband)","tuba_bb":"Tuba i B♭ (G-nøgle, brassband)","piano":"Klaver","klokkespill":"Klokkespil","xylofon":"Xylofon","pauker":"Pauker"},"levels":[{"name":"Begynder","sub":"musikskole, 1.–2. år","body":"Dur i C, F og G (noteret), a-mol hen mod slutningen. Én oktav, roligt og jævnt (♩ ≈ 60–72). Klang før teknik.","tips":["Lange toner først: 8+ slag pr. tone med rolig, jævn luftstrøm eller jævnt strøg.","Syng skalaen, før du spiller den — hør tonen, før du laver den.","Brug spejl og lyt: en jævn klang på hver tone er vigtigere end tempo."],"brassTips":["Lange toner først: 8+ slag på g¹ og c¹ (lavt C) med rolig, åben luftstrøm.","Læbebindinger på åbne deltoner (c¹–g¹–c²) uden ventiler før skalaen.","Syng eller »buzz« skalaen på mundstykket, før du spiller den."]},{"name":"Øvet","sub":"grad 3–5 / mellemniveau","body":"Dur til 3–4 fortegn (de typiske orkestertonearter), mol i harmonisk og melodisk form, kromatisk skala, dominantseptim. Ottendedele ♩ ≈ 80–100, både bundet og med tungestød.","tips":["Øv skalaen bundet først, derefter artikuleret i samme tempo — altid med metronom.","Øv også oppefra og ned — vejen ned afslører ujævnheder.","Planlæg vejrtrækningen/strøget: den sidste tone skal være lige så fuld som den første."],"brassTips":["Daglige læbebindinger (Arban/Schlossberg) på alle ventilkombinationer.","Øv skalaen bundet først, derefter med tungestød i samme tempo — altid med metronom.","Planlæg vejrtrækningen: højst én indånding pr. oktavløb, og den sidste tone lige så fuld som den første."]},{"name":"Viderekommen","sub":"MGK / grad 6–8","body":"Alle 12 dur- og moltonearter udenad, arpeggioer (dur, mol, dom7, dim7). To oktaver, hvor registeret tillader det. Sekstendedele ♩ ≈ 80–112, blandede artikulationer.","tips":["Øv også skalaerne i tertsmønstre og med rytmevariationer.","To oktaver kommer af kontrol og afspændthed — ikke af kraft.","Kirketonearterne: samme fortegn, nyt udgangspunkt — hør forskellen."],"brassTips":["Øv også skalaerne oppefra og ned samt i tertsmønstre.","To oktaver kommer af luftstøtte og fleksibilitet — ikke af mundstykkepres.","Kirketonearterne: samme fortegn, nyt udgangspunkt — hør forskellen."]},{"name":"Professionel","sub":"konservatorium / daglig rutine","body":"Alle tonearter i alle modi, jazz- og symmetriske skalaer, mønsterstudier gennem hele registeret — i alle artikulationer og dynamikker.","tips":["Rotér: én toneart om dagen, gennem alle modi og arpeggioer.","Øv i alle dynamikker — pianissimo afslører mest.","Transponér etuder: tænk klingende og noteret på samme tid."],"brassTips":["Clarke-studie nr. 2 gennem alle tonearter — pianissimo og ubesværet.","Rotér: én toneart om dagen, gennem alle modi og arpeggioer.","Transponér etuder: tænk klingende og noteret på samme tid."]}],"theory":{"tKvintTitle":"Sådan læser du kvintcirklen","tKvint":"<p>Kvintcirklen ordner alle tonearter efter, hvor mange faste fortegn de har. Ét trin <b>med uret</b> er en ren kvint op — og ét kryds mere (eller ét b mindre). Ét trin <b>mod uret</b> er en kvint ned — ét b mere.</p><p>Nabotonearter deler seks af syv toner og klinger derfor nært beslægtede. Det er grunden til, at <b>dominanten (D)</b> — kvinten over — og <b>subdominanten (S)</b> — kvinten under — er de vigtigste akkordfunktioner ved siden af tonika.</p><p>Ydre og indre ring på samme plads deler faste fortegn: det er <b>paralleltonearter</b> (f.eks. {exMajor} og {exMinor}). Nederst i cirklen mødes kryds- og b-siden i de <b>enharmoniske</b> tonearter: samme klingende toner, to skrivemåder.</p>","tFortegnTitle":"Fortegn: rækkefølge og alle tonearter","tFortegn":"<p>Krydserne kommer altid i rækkefølgen <b>{sharpOrder}</b> (kvintvis opad). B'erne kommer i modsat rækkefølge: <b>{flatOrder}</b> (kvintvis nedad).</p><p>To nyttige huskeregler: <b>det sidste kryds</b> ligger et halvtonetrin under grundtonen i dur (ledetonen). <b>Det næstsidste b</b> <i>er</i> durtonearten.</p>","thSig":"Faste fortegn","thDur":"Dur","thMoll":"Mol","thAccs":"Fortegnene","tParallellTitle":"Paralleltoneart og varianttoneart","tParallell":"<p>I dansk (og tysk) teori betyder <b>paralleltoneart</b> den dur- og moltoneart, der deler faste fortegn, med grundtoner en lille terts fra hinanden: {exKey} ↔ {exRel}. (På engelsk hedder det »relative key« — pas på ved oversættelser!)</p><p><b>Varianttoneart</b> er dur og mol på <i>samme grundtone</i>, f.eks. {exVar1} og {exVar2} — samme tonika, men tre fortegns forskel.</p><p>Mol findes i tre former: <b>naturlig</b> (som parallel dur), <b>harmonisk</b> (hævet 7. trin — giver ledetone og en karakteristisk forstørret sekund) og <b>melodisk</b> (hævet 6. og 7. trin opad; naturlig form nedad i klassisk tradition).</p>","tTranspTitle":"Transponering: {instr} og andre instrumenter","tTranspTransposing":"<p>{instr} er et <b>transponerende instrument</b>: et noteret C klinger som {soundsNote} — {interval} {direction}. For at få en ønsket klingende tone noterer man derfor {interval} {oppositeDirection}.</p>","tTranspNon":"<p>{instr} er <b>ikke-transponerende</b>: noteret node og klingende tone er den samme. Tabellen nedenfor viser alligevel, hvordan transponerende instrumenter forholder sig til klingende tonehøjde.</p>","tTranspTable":"<p>Samme princip gælder resten af orkestret: <b>klarinet i B♭</b> (en stor sekund op), <b>valdhorn i F</b> (en ren kvint op), <b>altsaxofon i E♭</b> (en stor sekst op), <b>kontrabas</b> (en oktav op). Tommelfingerregel: instrumentets navn er den klingende tone, når det spiller et noteret C.</p>","thConcert":"Klingende (koncert)","thWritten":"Noteret for {instr}","thWrittenSig":"Noterede fortegn","lower":"lavere","higher":"højere","up":"op","down":"ned","tIntonasjonTitle":"Intonation på messinginstrumenter med ventiler","tIntonasjon":"<p>Ventilerne sænker tonen med faste rørlængder, men kombinationer bliver for korte — derfor er nogle greb systematisk ustemte:</p><p><b>1·3 og 1·2·3 er høje.</b> Noteret {noteD4} (1·3) og {noteCiss4} (1·2·3) er de berygtede: skub 3.-ventilbøjlen ud (ca. 1–1,5 cm for 1·3, 2–2,5 cm for 1·2·3).</p><p><b>5. deltone er lav.</b> Noteret {noteE5} på åbent greb ligger ~14 cent for lavt — justér med læberne, eller brug 1·2 (6. deltone) som alternativt greb.</p><p><b>7. deltone undgås.</b> Åben {noteB5} ligger ~31 cent for lavt og bruges kun til jazz-effekter (»shake«) — spil den med 1. ventil.</p><p>3. ventil alene ≈ 1·2 og bruges som alternativt greb til triller og intonation ({alt3list}).</p>","tGrepTitle":"Fuld grebstabel (kromatisk, noteret {low}–{high})","tGrep":"<p>Alle greb for {instr}, fra den dybeste tone ({low}) og op i det høje register. Toner, der indgår i den valgte skala, er fremhævet. Hold markøren over en celle for alternative greb og intonationstips. Oktavtal efter international standard: C4 = enstreget c.</p>","tGrepPiccoloNote":"<p>Bemærk: piccolotrompet har normalt en 4. ventil (sænker en ren kvart), som udvider registeret nedad.</p>"},"footer":{"ruleTransposing":"{instr}: en noteret tone klinger {interval} {direction}.","ruleNon":"{instr}: noteret og klingende tonehøjde er den samme."},"families":{"trumpet":"Trompet","horn":"Valdhorn","trombone":"Trombone","euphonium":"Euphonium","tuba":"Tuba","flute":"Fløjte","oboe":"Obo","clarinet":"Klarinet","bassoon":"Fagot","sax":"Saxofon","violinF":"Violin","violaF":"Bratsch","celloF":"Cello","dbassF":"Kontrabas","pianoF":"Klaver","percussion":"Slagtøj"}},"de":{"meta":{"lang":"de","name":"Deutsch"},"ui":{"title":"Der Notenzirkel","subtitle":"Tonarten, Skalen, Transposition und Griffe für das ganze Orchester. Sprache und Instrument wählen, in den Quintenzirkel klicken — und Noten, Vorzeichen und Griffe vom Anfänger- bis zum Profiniveau sehen.","language":"Sprache","instrument":"Instrument","view":"Ansicht","viewConcert":"Klingend (C)","viewWritten":"Notiert für {instr}","naming":"Notennamen","namingNative":"Deutsch (H · B · Fis)","namingIntl":"International (B · B♭ · F♯)","scale":"Skala","range":"Umfang","oct1":"1 Oktave","oct2":"2 Oktaven","direction":"Richtung","dirUp":"Aufwärts","dirUpDown":"Auf und ab","tempo":"Tempo","bpm":"Schläge/min","play":"Skala abspielen","stop":"Stopp","playSounding":"Klingend abspielen (wie {instr})","circleTitle":"Der Quintenzirkel","circleHint":"Äußerer Ring: Dur. Innerer Ring: Moll. Im Uhrzeigersinn = Quinte aufwärts (+1 Kreuz), gegen den Uhrzeigersinn = Quinte abwärts (+1 B).","dur":"Dur","moll":"Moll","enhSwap":"Enharmonische Verwechslung","hubOn":"auf {instr}: {key}","hubSounds":"klingend: {key}","looseAccs":"(Versetzungszeichen)","writtenKeyFor":"Notierte Tonart für {instr}","concertKey":"Klingende Tonart","factSig":"Vorzeichen","factRel":"Paralleltonart (gemeinsame Vorzeichen)","factVar":"Varianttonart (gleicher Grundton)","factDom":"Dominante (D)","factSub":"Subdominante (S)","factEnh":"Enharmonisch gleich","noSig":"keine Vorzeichen","sharpOne":"Kreuz","sharpMany":"Kreuze","flatOne":"B","flatMany":"B","soundsAs":"Klingt wie <b>{key}</b> ({interval} {dir}).","writtenAs":"Für {instr} wird dies als <b>{key}</b> notiert ({interval} {dir}).","nonTransposing":"{instr} ist nicht transponierend: Notierte und klingende Tonhöhe sind gleich.","staffHintWritten":"Die Griffe gelten für die notierten Töne. Auf eine Note klicken, um sie zu hören.","staffHintConcert":"Die Noten sind klingend notiert; die Griffe zeigen, was {instr} verwendet. Auf eine Note klicken, um sie zu hören.","staffHintNoFing":"Auf eine Note klicken, um sie zu hören.","stepsLabel":"Schritte","stepsLegend":"1 = Ganztonschritt, ½ = Halbtonschritt","chromSteps":"nur Halbtonschritte (½ × 12 pro Oktave)","keyboard":"Klaviatur","kbdWritten":"Die notierten Töne der Skala — klingend {interval} tiefer.","kbdWrittenUp":"Die notierten Töne der Skala — klingend {interval} höher.","kbdConcert":"Die klingenden Töne der Skala.","kbdRoot":"Der Grundton ist ausgefüllt.","levelsTitle":"Vom Anfänger zum Profi","levelsHint":"Übliche Progression beim Skalenüben. Auf ein Niveau klicken für Empfehlungen, und auf eine Tonart klicken, um sie aufzurufen.","theoryTitle":"Theorie zum Nachschlagen","harm":"(harm.)","mel":"(mel.)","openValve":"offen","fingering":"Griff","alt":"alt.","outOfRange":"außerhalb des üblichen Registers","forWritten":"für notiertes {note}","octaveWord":"Oktave","written":"notiert","sounding":"klingend","footerTuning":"Stimmung: A4 = 440 Hz, gleichstufig temperiert.","octaves":"Oktave|Oktaven","and":"und","fingClause":" Die Griffe unter den Noten gelten für die notierten Töne.","variant":"Variante","standard":"Standard"},"intonation":{"i123":"Wird leicht zu hoch — den 3. Ventilzug ausziehen","i13":"Wird leicht zu hoch — den 3. Ventilzug verwenden","i5th":"5. Naturton — kann beim offenen Griff zu tief liegen","ihigh":"Hohes Register","ihigh12":"Hohes Register — die Intonation wird vor allem von den Lippen gesteuert"},"intervals":{"qualities":{"perf":"reine","maj":"große","min":"kleine"},"numbers":["Prime","Sekunde","Terz","Quarte","Quinte","Sexte","Septime"],"octaveOne":"eine Oktave","octaveTwo":"zwei Oktaven","pattern":"eine {qual} {num}","octavePlus":"{oct} und eine {qual} {num}"},"keys":{"majorPattern":"{note}-Dur","minorPattern":"{note}-Moll","minorLowercase":true},"scales":{"dur":"Dur (ionisch)","nmoll":"Natürliches Moll (äolisch)","durpent":"Durpentatonik","hmoll":"Harmonisches Moll","mmoll":"Melodisches Moll (aufwärts)","mollpent":"Mollpentatonik","blues":"Blues","krom":"Chromatisch","dorisk":"Dorisch","frygisk":"Phrygisch","lydisk":"Lydisch","mikso":"Mixolydisch","lokrisk":"Lokrisch","heltone":"Ganztonleiter","dimhh":"Vermindert (Ganzton–Halbton)","dimhalv":"Vermindert (Halbton–Ganzton)","alterert":"Alteriert (superlokrisch)","lyddom":"Lydisch-dominant","frygdom":"Phrygisch-dominant","bebopdom":"Bebop-Dominant","bebopdur":"Bebop-Dur","arpdur":"Dur-Dreiklang","arpmoll":"Moll-Dreiklang","arpdom7":"Dominantseptakkord","arpmaj7":"Maj7","arpm7":"Moll7","arpdim7":"Dim7","arpSuffix":"(Arpeggio)"},"scaleGroups":{"g1":"Stufe 1 · Grundskalen","g2":"Stufe 2 · Moll-Varianten und Blues","g3":"Stufe 3 · Kirchentonarten (Modi)","g4":"Stufe 3–4 · Arpeggien","g5":"Stufe 4 · Jazz und symmetrische Skalen"},"instrumentGroups":{"strings":"Streicher","woodwind":"Holzbläser","brass":"Blechbläser","other":"Tasten und Schlagwerk"},"instruments":{"violin":"Violine","viola":"Viola","cello":"Violoncello","dbass":"Kontrabass","piccolo":"Piccoloflöte","flute":"Flöte","altflute":"Altflöte in G","oboe":"Oboe","englhorn":"Englischhorn in F","klar_bb":"Klarinette in B","klar_a":"Klarinette in A","klar_eb":"Klarinette in Es","bassklar":"Bassklarinette in B","fagott":"Fagott","kontrafag":"Kontrafagott","sopransax":"Sopransaxophon in B","altsax":"Altsaxophon in Es","tenorsax":"Tenorsaxophon in B","barisax":"Baritonsaxophon in Es","tromp_bb":"Trompete in B","tromp_c":"Trompete in C","tromp_d":"Trompete in D","tromp_eb":"Trompete in Es","picctromp":"Piccolotrompete in B","kornett_bb":"Kornett in B","kornett_eb":"Soprankornett in Es","flygelhorn":"Flügelhorn in B","basstromp":"Basstrompete in B","horn_f":"Horn in F","althorn":"Althorn in Es","trombone":"Posaune","basstrombone":"Bassposaune","eufonium_c":"Euphonium (Bassschlüssel)","eufonium_bb":"Euphonium/Bariton in B (Violinschlüssel)","tuba":"Tuba (Bassschlüssel)","tuba_eb":"Tuba in Es (Violinschlüssel, Brassband)","tuba_bb":"Tuba in B (Violinschlüssel, Brassband)","piano":"Klavier","klokkespill":"Glockenspiel","xylofon":"Xylophon","pauker":"Pauken"},"levels":[{"name":"Anfänger","sub":"Musikschule, 1.–2. Jahr","body":"C-Dur, F-Dur und G-Dur (notiert), gegen Ende a-Moll. Eine Oktave, ruhig und gleichmäßig (♩ ≈ 60–72). Klang vor Technik.","tips":["Zuerst lange Töne: 8+ Schläge pro Ton mit ruhigem, gleichmäßigem Luftstrom oder Bogenstrich.","Die Skala vor dem Spielen singen — den Ton hören, bevor man ihn erzeugt.","Spiegel benutzen und zuhören: Ein gleichmäßiger Klang auf jedem Ton ist wichtiger als das Tempo."],"brassTips":["Zuerst lange Töne: 8+ Schläge auf g¹ und c¹ (tiefes C) mit ruhigem, offenem Luftstrom.","Lippenbindungen auf offenen Naturtönen (c¹–g¹–c²) ohne Ventile vor der Skala.","Die Skala singen oder auf dem Mundstück „buzzen“, bevor man sie spielt."]},{"name":"Mittelstufe","sub":"Stufe 3–5 / mittleres Niveau","body":"Dur bis 3–4 Vorzeichen (die Blasorchester-Tonarten), Moll in harmonischer und melodischer Form, chromatische Tonleiter, Dominantseptakkord. Achtel bei ♩ ≈ 80–100, sowohl gebunden als auch gestoßen.","tips":["Die Skala zuerst gebunden üben, dann artikuliert im gleichen Tempo — immer mit Metronom.","Auch von oben nach unten üben — der Abstieg deckt Ungleichmäßigkeiten auf.","Atmung/Bogenstrich planen: Der letzte Ton soll so voll klingen wie der erste."],"brassTips":["Tägliche Lippenbindungen (Arban/Schlossberg) auf allen Ventilkombinationen.","Die Skala zuerst gebunden üben, dann gestoßen im gleichen Tempo — immer mit Metronom.","Die Atmung planen: höchstens ein Atemzug pro Oktavlauf, und der letzte Ton so voll wie der erste."]},{"name":"Fortgeschrittene","sub":"Musikgymnasium / Stufe 6–8","body":"Alle 12 Dur- und Molltonarten auswendig, Arpeggien (Dur, Moll, Dom7, Dim7). Zwei Oktaven, wo das Register es zulässt. Sechzehntel bei ♩ ≈ 80–112, gemischte Artikulationen.","tips":["Die Skalen auch in Terzmustern und mit Rhythmusvariationen üben.","Zwei Oktaven entstehen durch Kontrolle und Entspannung — nicht durch Kraft.","Die Kirchentonarten: gleiche Vorzeichen, neuer Ausgangspunkt — den Unterschied hören."],"brassTips":["Die Skalen auch von oben nach unten und in Terzmustern üben.","Zwei Oktaven entstehen durch Luftstütze und Flexibilität — nicht durch Mundstückdruck.","Die Kirchentonarten: gleiche Vorzeichen, neuer Ausgangspunkt — den Unterschied hören."]},{"name":"Profi","sub":"Konservatorium / tägliche Routine","body":"Alle Tonarten in allen Modi, Jazz-Skalen und symmetrische Skalen, Pattern-Studien durch das gesamte Register — in allen Artikulationen und Dynamikstufen.","tips":["Rotieren: eine Tonart pro Tag, durch alle Modi und Arpeggien.","In allen Dynamikstufen üben — Pianissimo deckt am meisten auf.","Etüden transponieren: klingend und notiert gleichzeitig denken."],"brassTips":["Clarke-Studie Nr. 2 durch alle Tonarten — pianissimo und mühelos.","Rotieren: eine Tonart pro Tag, durch alle Modi und Arpeggien.","Etüden transponieren: klingend und notiert gleichzeitig denken."]}],"theory":{"tKvintTitle":"So liest man den Quintenzirkel","tKvint":"<p>Der Quintenzirkel ordnet alle Tonarten danach, wie viele Vorzeichen sie haben. Ein Schritt <b>im Uhrzeigersinn</b> ist eine reine Quinte aufwärts — und ein Kreuz mehr (oder ein B weniger). Ein Schritt <b>gegen den Uhrzeigersinn</b> ist eine Quinte abwärts — ein B mehr.</p><p>Benachbarte Tonarten teilen sechs von sieben Tönen und klingen daher eng verwandt. Das ist der Grund, warum die <b>Dominante (D)</b> — die Quinte darüber — und die <b>Subdominante (S)</b> — die Quinte darunter — neben der Tonika die wichtigsten Akkordfunktionen sind.</p><p>Äußerer und innerer Ring an derselben Position teilen die Vorzeichen: Das sind <b>Paralleltonarten</b> (z. B. {exMajor} und {exMinor}). Unten im Zirkel treffen sich Kreuz- und B-Seite in den <b>enharmonischen</b> Tonarten: gleiche klingende Töne, zwei Schreibweisen.</p>","tFortegnTitle":"Vorzeichen: Reihenfolge und alle Tonarten","tFortegn":"<p>Die Kreuze folgen immer der Reihenfolge <b>{sharpOrder}</b> (quintweise aufwärts). Die B-Vorzeichen kommen in umgekehrter Reihenfolge: <b>{flatOrder}</b> (quintweise abwärts).</p><p>Zwei nützliche Merkregeln: Das <b>letzte Kreuz</b> liegt einen Halbtonschritt unter dem Grundton der Durtonart (Leitton). Das <b>vorletzte B</b> <i>ist</i> die Durtonart.</p>","thSig":"Vorzeichen","thDur":"Dur","thMoll":"Moll","thAccs":"Die Vorzeichen","tParallellTitle":"Paralleltonart und Varianttonart","tParallell":"<p>In der deutschen (und norwegischen) Theorie bezeichnet <b>Paralleltonart</b> die Dur- und Molltonart mit gemeinsamen Vorzeichen, deren Grundtöne eine kleine Terz auseinanderliegen: {exKey} ↔ {exRel}. (Im Englischen heißt das „relative key“ — Vorsicht beim Übersetzen!)</p><p>Die <b>Varianttonart</b> ist Dur und Moll auf <i>demselben Grundton</i>, z. B. {exVar1} und {exVar2} — gleiche Tonika, aber drei Vorzeichen Unterschied.</p><p>Moll gibt es in drei Formen: <b>natürlich</b> (wie die Durparallele), <b>harmonisch</b> (erhöhte 7. Stufe — ergibt einen Leitton und eine charakteristische übermäßige Sekunde) und <b>melodisch</b> (erhöhte 6. und 7. Stufe aufwärts; abwärts in der klassischen Tradition die natürliche Form).</p>","tTranspTitle":"Transposition: {instr} und andere Instrumente","tTranspTransposing":"<p>{instr} ist ein <b>transponierendes Instrument</b>: Ein notiertes C erklingt als {soundsNote} — {interval} {direction}. Um einen gewünschten klingenden Ton zu erhalten, notiert man daher {interval} {oppositeDirection}.</p>","tTranspNon":"<p>{instr} ist <b>nicht transponierend</b>: Notierte Note und klingender Ton sind identisch. Die Tabelle unten zeigt dennoch, wie sich transponierende Instrumente zur klingenden Tonhöhe verhalten.</p>","tTranspTable":"<p>Dasselbe Prinzip gilt für den Rest des Orchesters: <b>Klarinette in B</b> (große Sekunde aufwärts), <b>Horn in F</b> (reine Quinte aufwärts), <b>Altsaxophon in Es</b> (große Sexte aufwärts), <b>Kontrabass</b> (eine Oktave aufwärts). Faustregel: Der Name des Instruments ist der klingende Ton, wenn es ein notiertes C spielt.</p>","thConcert":"Klingend","thWritten":"Notiert für {instr}","thWrittenSig":"Notierte Vorzeichen","lower":"tiefer","higher":"höher","up":"aufwärts","down":"abwärts","tIntonasjonTitle":"Intonation auf Blechblasinstrumenten mit Ventilen","tIntonasjon":"<p>Die Ventile senken den Ton um feste Rohrlängen, doch Kombinationen werden zu kurz — deshalb sind manche Griffe systematisch verstimmt:</p><p><b>1·3 und 1·2·3 sind zu hoch.</b> Notiertes {noteD4} (1·3) und {noteCiss4} (1·2·3) sind die berüchtigten Kandidaten: den 3. Ventilzug ausziehen (ca. 1–1,5 cm bei 1·3, 2–2,5 cm bei 1·2·3).</p><p><b>Der 5. Naturton ist zu tief.</b> Notiertes {noteE5} auf offenem Griff liegt ~14 Cent zu tief — mit den Lippen korrigieren oder 1·2 (6. Naturton) als Alternativgriff verwenden.</p><p><b>Der 7. Naturton wird vermieden.</b> Offenes {noteB5} liegt ~31 Cent zu tief und wird nur für Jazz-Effekte („Shake“) verwendet — mit dem 1. Ventil spielen.</p><p>Das 3. Ventil allein ≈ 1·2 und dient als Alternativgriff für Triller und Intonation ({alt3list}).</p>","tGrepTitle":"Vollständige Grifftabelle (chromatisch, notiert {low}–{high})","tGrep":"<p>Alle Griffe für {instr}, vom tiefsten Ton ({low}) bis hinauf ins hohe Register. Töne der gewählten Skala sind hervorgehoben. Den Mauszeiger über eine Zelle halten für Alternativgriffe und Intonationstipps. Oktavzahlen nach internationalem Standard: C4 = eingestrichenes c.</p>","tGrepPiccoloNote":"<p>Hinweis: Die Piccolotrompete hat üblicherweise ein 4. Ventil (senkt um eine reine Quarte), das den Tonumfang nach unten erweitert.</p>"},"footer":{"ruleTransposing":"{instr}: Eine notierte Note klingt {interval} {direction}.","ruleNon":"{instr}: Notierte und klingende Tonhöhe sind gleich."},"families":{"trumpet":"Trompete","horn":"Horn","trombone":"Posaune","euphonium":"Euphonium","tuba":"Tuba","flute":"Flöte","oboe":"Oboe","clarinet":"Klarinette","bassoon":"Fagott","sax":"Saxophon","violinF":"Violine","violaF":"Viola","celloF":"Violoncello","dbassF":"Kontrabass","pianoF":"Klavier","percussion":"Schlagwerk"}},"fr":{"meta":{"lang":"fr","name":"Français"},"ui":{"title":"Le Cercle des notes","subtitle":"Tonalités, gammes, transposition et doigtés pour tout l'orchestre. Choisissez la langue et l'instrument, cliquez dans le cycle des quintes — et découvrez notes, altérations et doigtés, du niveau débutant au niveau professionnel.","language":"Langue","instrument":"Instrument","view":"Affichage","viewConcert":"Sons réels (en Ut)","viewWritten":"Écrit pour {instr}","naming":"Noms des notes","namingNative":"Solfège (Do · Ré · Mi)","namingIntl":"Notation internationale (B · B♭ · F♯)","scale":"Gamme","range":"Étendue","oct1":"1 octave","oct2":"2 octaves","direction":"Sens","dirUp":"Montante","dirUpDown":"Montante et descendante","tempo":"Tempo","bpm":"batt./min","play":"Jouer la gamme","stop":"Arrêter","playSounding":"Jouer en sons réels (comme {instr})","circleTitle":"Le cycle des quintes","circleHint":"Anneau extérieur : majeur. Anneau intérieur : mineur. Sens horaire = une quinte vers le haut (+1 dièse), sens antihoraire = une quinte vers le bas (+1 bémol).","dur":"Majeur","moll":"Mineur","enhSwap":"Échange enharmonique","hubOn":"sur {instr} : {key}","hubSounds":"sons réels : {key}","looseAccs":"(altérations accidentelles)","writtenKeyFor":"Tonalité écrite pour {instr}","concertKey":"Tonalité réelle (concert)","factSig":"Armure","factRel":"Tonalité relative (même armure)","factVar":"Tonalité homonyme (même tonique)","factDom":"Dominante (D)","factSub":"Sous-dominante (S)","factEnh":"Équivalent enharmonique","noSig":"aucune altération à l'armure","sharpOne":"dièse","sharpMany":"dièses","flatOne":"bémol","flatMany":"bémols","soundsAs":"Sonne comme <b>{key}</b> ({interval} {dir}).","writtenAs":"Sur {instr}, cela s'écrit <b>{key}</b> ({interval} {dir}).","nonTransposing":"{instr} est un instrument non transpositeur : la hauteur écrite et la hauteur réelle sont identiques.","staffHintWritten":"Les doigtés correspondent aux notes écrites. Cliquez sur une note pour l'écouter.","staffHintConcert":"Les notes sont en sons réels ; les doigtés sont ceux utilisés par {instr}. Cliquez sur une note pour l'écouter.","staffHintNoFing":"Cliquez sur une note pour l'écouter.","stepsLabel":"Structure","stepsLegend":"1 = ton, ½ = demi-ton","chromSteps":"uniquement des demi-tons (½ × 12 par octave)","keyboard":"Clavier","kbdWritten":"Notes écrites de la gamme — elles sonnent {interval} plus bas.","kbdWrittenUp":"Notes écrites de la gamme — elles sonnent {interval} plus haut.","kbdConcert":"Notes de la gamme en sons réels.","kbdRoot":"La tonique est affichée en couleur pleine.","levelsTitle":"Du débutant au professionnel","levelsHint":"Progression habituelle pour les gammes. Cliquez sur un niveau pour voir les recommandations, et sur une tonalité pour l'afficher.","theoryTitle":"Théorie et références","harm":"(harm.)","mel":"(mél.)","openValve":"à vide","fingering":"doigté","alt":"alt.","outOfRange":"hors du registre habituel","forWritten":"pour {note} écrit","octaveWord":"octave","written":"écrit","sounding":"réel","footerTuning":"Diapason : La4 = 440 Hz, tempérament égal.","octaves":"octave|octaves","and":"et","fingClause":" Les doigtés sous les notes correspondent aux notes écrites.","variant":"Variante","standard":"standard"},"intonation":{"i123":"A tendance à sonner haut — sortez la coulisse du 3e piston","i13":"A tendance à sonner haut — utilisez la coulisse du 3e piston","i5th":"5e harmonique — peut être bas en doigté à vide","ihigh":"Registre aigu","ihigh12":"Registre aigu — l'intonation dépend surtout des lèvres"},"intervals":{"qualities":{"perf":"juste","maj":"majeure","min":"mineure"},"numbers":["unisson","seconde","tierce","quarte","quinte","sixte","septième"],"octaveOne":"une octave","octaveTwo":"deux octaves","pattern":"une {num} {qual}","octavePlus":"{oct} et une {num} {qual}","unison":"un unisson juste"},"keys":{"majorPattern":"{note} majeur","minorPattern":"{note} mineur","minorLowercase":true},"scales":{"dur":"Majeur (ionien)","nmoll":"Mineur naturel (éolien)","durpent":"Pentatonique majeure","hmoll":"Mineur harmonique","mmoll":"Mineur mélodique (ascendant)","mollpent":"Pentatonique mineure","blues":"Blues","krom":"Chromatique","dorisk":"Dorien","frygisk":"Phrygien","lydisk":"Lydien","mikso":"Mixolydien","lokrisk":"Locrien","heltone":"Gamme par tons","dimhh":"Diminuée (ton–demi-ton)","dimhalv":"Diminuée (demi-ton–ton)","alterert":"Altérée (super-locrien)","lyddom":"Lydien dominant","frygdom":"Phrygien dominant","bebopdom":"Bebop dominante","bebopdur":"Bebop majeure","arpdur":"Accord parfait majeur","arpmoll":"Accord parfait mineur","arpdom7":"Septième de dominante","arpmaj7":"Maj7","arpm7":"Mineur 7","arpdim7":"Septième diminuée","arpSuffix":"(arpège)"},"scaleGroups":{"g1":"Niveau 1 · Gammes de base","g2":"Niveau 2 · Formes du mineur et blues","g3":"Niveau 3 · Modes ecclésiastiques","g4":"Niveaux 3–4 · Arpèges","g5":"Niveau 4 · Jazz et gammes symétriques"},"instrumentGroups":{"strings":"Cordes","woodwind":"Bois","brass":"Cuivres","other":"Claviers et percussions"},"instruments":{"violin":"Violon","viola":"Alto","cello":"Violoncelle","dbass":"Contrebasse","piccolo":"Piccolo","flute":"Flûte","altflute":"Flûte alto en Sol","oboe":"Hautbois","englhorn":"Cor anglais en Fa","klar_bb":"Clarinette en Si♭","klar_a":"Clarinette en La","klar_eb":"Petite clarinette en Mi♭","bassklar":"Clarinette basse en Si♭","fagott":"Basson","kontrafag":"Contrebasson","sopransax":"Saxophone soprano en Si♭","altsax":"Saxophone alto en Mi♭","tenorsax":"Saxophone ténor en Si♭","barisax":"Saxophone baryton en Mi♭","tromp_bb":"Trompette en Si♭","tromp_c":"Trompette en Ut","tromp_d":"Trompette en Ré","tromp_eb":"Trompette en Mi♭","picctromp":"Trompette piccolo en Si♭","kornett_bb":"Cornet en Si♭","kornett_eb":"Cornet soprano en Mi♭","flygelhorn":"Bugle en Si♭","basstromp":"Trompette basse en Si♭","horn_f":"Cor en Fa","althorn":"Saxhorn alto en Mi♭","trombone":"Trombone","basstrombone":"Trombone basse","eufonium_c":"Euphonium (clé de fa)","eufonium_bb":"Euphonium/baryton en Si♭ (clé de sol)","tuba":"Tuba (clé de fa)","tuba_eb":"Tuba en Mi♭ (clé de sol, brass band)","tuba_bb":"Tuba en Si♭ (clé de sol, brass band)","piano":"Piano","klokkespill":"Glockenspiel","xylofon":"Xylophone","pauker":"Timbales"},"levels":[{"name":"Débutant","sub":"école de musique, 1re–2e année","body":"Majeur en Do, Fa et Sol (écrits), la mineur vers la fin. Une octave, calme et régulière (♩ ≈ 60–72). Le son avant la technique.","tips":["Les sons longs d'abord : 8 temps ou plus par note, avec un souffle ou un archet calme et régulier.","Chantez la gamme avant de la jouer — entendez la note avant de la produire.","Utilisez un miroir et écoutez : un son égal sur chaque note compte plus que le tempo."],"brassTips":["Les sons longs d'abord : 8 temps ou plus sur sol¹ et do¹ (do grave), avec un souffle calme et ouvert.","Souplesses sur les harmoniques à vide (do¹–sol¹–do²), sans pistons, avant la gamme.","Chantez ou « buzzez » la gamme sur l'embouchure avant de la jouer."]},{"name":"Intermédiaire","sub":"niveaux 3–5 / 2e cycle","body":"Majeur jusqu'à 3–4 altérations (les tonalités de l'orchestre d'harmonie), mineur harmonique et mélodique, gamme chromatique, septième de dominante. Croches à ♩ ≈ 80–100, en lié comme en détaché.","tips":["Travaillez la gamme d'abord en lié, puis en articulé au même tempo — toujours avec le métronome.","Travaillez aussi en partant du haut — la descente révèle les inégalités.","Planifiez la respiration ou l'archet : la dernière note aussi pleine que la première."],"brassTips":["Souplesses quotidiennes (Arban/Schlossberg) sur toutes les combinaisons de pistons.","Travaillez la gamme d'abord en lié, puis en détaché au même tempo — toujours avec le métronome.","Planifiez la respiration : une seule respiration au maximum par octave, et la dernière note aussi pleine que la première."]},{"name":"Avancé","sub":"niveaux 6–8 / 3e cycle","body":"Les 12 tonalités majeures et mineures par cœur, arpèges (majeur, mineur, 7e de dominante, 7e diminuée). Deux octaves quand le registre le permet. Doubles croches à ♩ ≈ 80–112, articulations variées.","tips":["Travaillez aussi les gammes en tierces et avec des variations rythmiques.","Les deux octaves viennent du contrôle et de la détente — pas de la force.","Les modes : même armure, nouveau point de départ — écoutez la différence."],"brassTips":["Travaillez aussi les gammes en partant du haut, et en tierces.","Les deux octaves viennent du soutien de l'air et de la souplesse — pas de la pression de l'embouchure.","Les modes : même armure, nouveau point de départ — écoutez la différence."]},{"name":"Professionnel","sub":"conservatoire / routine quotidienne","body":"Toutes les tonalités dans tous les modes, gammes de jazz et gammes symétriques, études de motifs sur toute l'étendue du registre — dans toutes les articulations et toutes les nuances.","tips":["Alternez : une tonalité par jour, à travers tous les modes et arpèges.","Travaillez dans toutes les nuances — le pianissimo est le plus révélateur.","Transposez des études : pensez simultanément en sons réels et en notes écrites."],"brassTips":["L'étude n° 2 de Clarke dans toutes les tonalités — pianissimo et sans effort.","Alternez : une tonalité par jour, à travers tous les modes et arpèges.","Transposez des études : pensez simultanément en sons réels et en notes écrites."]}],"theory":{"tKvintTitle":"Comment lire le cycle des quintes","tKvint":"<p>Le cycle des quintes classe toutes les tonalités selon le nombre d'altérations à l'armure. Un pas <b>dans le sens horaire</b> correspond à une quinte juste vers le haut — et à un dièse de plus (ou un bémol de moins). Un pas <b>dans le sens antihoraire</b> correspond à une quinte vers le bas — un bémol de plus.</p><p>Les tonalités voisines partagent six notes sur sept et sonnent donc étroitement apparentées. C'est pourquoi la <b>dominante (D)</b> — la quinte supérieure — et la <b>sous-dominante (S)</b> — la quinte inférieure — sont les fonctions harmoniques les plus importantes après la tonique.</p><p>À la même position, l'anneau extérieur et l'anneau intérieur partagent la même armure : ce sont des <b>tonalités relatives</b> (p. ex. {exMajor} et {exMinor}). En bas du cercle, le côté des dièses et celui des bémols se rejoignent dans les tonalités <b>enharmoniques</b> : les mêmes sons réels, deux écritures.</p>","tFortegnTitle":"Altérations : ordre et toutes les tonalités","tFortegn":"<p>Les dièses apparaissent toujours dans l'ordre <b>{sharpOrder}</b> (par quintes ascendantes). Les bémols suivent l'ordre inverse : <b>{flatOrder}</b> (par quintes descendantes).</p><p>Deux moyens mnémotechniques utiles : le <b>dernier dièse</b> se trouve un demi-ton sous la tonique de la tonalité majeure (c'est la sensible). L'<b>avant-dernier bémol</b> <i>est</i> la tonalité majeure.</p>","thSig":"Armure","thDur":"Majeur","thMoll":"Mineur","thAccs":"Altérations","tParallellTitle":"Tonalité relative et tonalité homonyme","tParallell":"<p>La <b>tonalité relative</b> est la tonalité majeure ou mineure qui partage la même armure, les toniques étant à une tierce mineure l'une de l'autre : {exKey} ↔ {exRel}. (En allemand et dans les langues scandinaves, on l'appelle « Paralleltonart » — attention lors des traductions !)</p><p>La <b>tonalité homonyme</b> réunit le majeur et le mineur sur la <i>même tonique</i>, p. ex. {exVar1} et {exVar2} — même tonique, mais trois altérations d'écart.</p><p>Le mineur existe sous trois formes : <b>naturel</b> (comme le relatif majeur), <b>harmonique</b> (7e degré haussé — il apporte la sensible et une seconde augmentée caractéristique) et <b>mélodique</b> (6e et 7e degrés haussés en montant ; forme naturelle en descendant dans la tradition classique).</p>","tTranspTitle":"Transposition : {instr} et les autres instruments","tTranspTransposing":"<p>{instr} est un <b>instrument transpositeur</b> : un Do écrit sonne {soundsNote} — {interval} {direction}. Pour obtenir un son réel donné, on écrit donc {interval} {oppositeDirection}.</p>","tTranspNon":"<p>{instr} est un instrument <b>non transpositeur</b> : la note écrite et le son réel sont identiques. Le tableau ci-dessous montre néanmoins comment les instruments transpositeurs se situent par rapport aux sons réels.</p>","tTranspTable":"<p>Le même principe s'applique au reste de l'orchestre : la <b>clarinette en Si♭</b> (une seconde majeure au-dessus), le <b>cor en Fa</b> (une quinte juste au-dessus), le <b>saxophone alto en Mi♭</b> (une sixte majeure au-dessus), la <b>contrebasse</b> (une octave au-dessus). Règle pratique : le nom de l'instrument est le son réel produit lorsqu'il joue un Do écrit.</p>","thConcert":"Sons réels (concert)","thWritten":"Écrit pour {instr}","thWrittenSig":"Armure écrite","lower":"plus bas","higher":"plus haut","up":"vers le haut","down":"vers le bas","tIntonasjonTitle":"Intonation des cuivres à pistons","tIntonasjon":"<p>Les pistons abaissent la note de longueurs de tuyau fixes, mais les combinaisons deviennent trop courtes — certains doigtés sont donc systématiquement faux :</p><p><b>1·3 et 1·2·3 sont hauts.</b> Les {noteD4} (1·3) et {noteCiss4} (1·2·3) écrits sont les plus notoires : sortez la coulisse du 3e piston (env. 1–1,5 cm pour 1·3, 2–2,5 cm pour 1·2·3).</p><p><b>Le 5e harmonique est bas.</b> Le {noteE5} écrit, en doigté à vide, est environ 14 cents trop bas — corrigez avec les lèvres, ou utilisez 1·2 (6e harmonique) comme doigté de rechange.</p><p><b>On évite le 7e harmonique.</b> Le {noteB5} à vide est environ 31 cents trop bas et ne sert qu'aux effets de jazz (« shake ») — jouez-le avec le 1er piston.</p><p>Le 3e piston seul ≈ 1·2 et sert de doigté de rechange pour les trilles et l'intonation ({alt3list}).</p>","tGrepTitle":"Table complète des doigtés (chromatique, écrit {low}–{high})","tGrep":"<p>Tous les doigtés pour {instr}, de la note la plus grave ({low}) jusqu'au registre aigu. Les notes de la gamme choisie sont mises en évidence. Survolez une case pour voir les doigtés de rechange et les conseils d'intonation. Octaves numérotées selon la norme internationale : Do4 (C4) = le do central.</p>","tGrepPiccoloNote":"<p>Remarque : la trompette piccolo possède généralement un 4e piston (qui abaisse d'une quarte juste) et étend ainsi le registre vers le grave.</p>"},"footer":{"ruleTransposing":"{instr} : la note écrite sonne {interval} {direction}.","ruleNon":"{instr} : la hauteur écrite et la hauteur réelle sont identiques."},"families":{"trumpet":"Trompette","horn":"Cor","trombone":"Trombone","euphonium":"Euphonium","tuba":"Tuba","flute":"Flûte","oboe":"Hautbois","clarinet":"Clarinette","bassoon":"Basson","sax":"Saxophone","violinF":"Violon","violaF":"Alto","celloF":"Violoncelle","dbassF":"Contrebasse","pianoF":"Piano","percussion":"Percussions"}},"es":{"meta":{"lang":"es","name":"Español"},"ui":{"title":"El círculo de notas","subtitle":"Tonalidades, escalas, transporte y digitaciones para toda la orquesta. Elige idioma e instrumento, haz clic en el círculo de quintas — y verás las notas, la armadura y las digitaciones desde el nivel principiante hasta el profesional.","language":"Idioma","instrument":"Instrumento","view":"Vista","viewConcert":"Sonido real (Do)","viewWritten":"Escrito para {instr}","naming":"Nombres de las notas","namingNative":"Latino (Do · Re · Mi)","namingIntl":"Internacional (B · B♭ · F♯)","scale":"Escala","range":"Ámbito","oct1":"1 octava","oct2":"2 octavas","direction":"Dirección","dirUp":"Ascendente","dirUpDown":"Ascendente y descendente","tempo":"Tempo","bpm":"puls./min","play":"Reproducir la escala","stop":"Detener"
